<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amzo AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background: conic-gradient(
        #ff004c,
        #ff00ff,
        #0066ff,
        #00ffff,
        #00ff66,
        #ffff00,
        #ff004c
      );
      animation: rgb 8s linear infinite;
      filter: blur(100px);
      opacity: 0.18;
      z-index: -1;
    }

    @keyframes rgb {
      to {
        transform: rotate(360deg);
      }
    }

    .app {
      width: 100%;
      max-width: 800px;
      min-height: 650px;
      background: rgba(12, 12, 18, 0.94);
      border: 2px solid transparent;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 0 15px #ff0066,
        0 0 35px #0066ff,
        0 0 60px #00ffff;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 2px;
      border-radius: 24px;
      background: linear-gradient(
        90deg,
        #ff004c,
        #ff00ff,
        #0066ff,
        #00ffff,
        #00ff66,
        #ffff00,
        #ff004c
      );
      background-size: 300% 300%;
      animation: borderRGB 5s linear infinite;
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes borderRGB {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header {
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #292936;
    }

    .header h1 {
      font-size: 34px;
      margin-bottom: 7px;
      background: linear-gradient(
        90deg,
        #ff0066,
        #ff00ff,
        #00ffff,
        #00ff66,
        #ffff00
      );
      background-size: 300%;
      -webkit-background-clip: text;
      color: transparent;
      animation: textRGB 4s linear infinite;
    }

    @keyframes textRGB {
      0% { background-position: 0%; }
      100% { background-position: 300%; }
    }

    .header p {
      color: #888;
      font-size: 14px;
    }

    #chat {
      height: 440px;
      overflow-y: auto;
      padding: 25px;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 80%;
      padding: 14px 17px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai .bubble {
      background: #181821;
      border: 1px solid #30303d;
    }

    .user .bubble {
      background: linear-gradient(
        90deg,
        #ff0066,
        #7b00ff,
        #0066ff
      );
    }

    .input-area {
      padding: 18px;
      border-top: 1px solid #292936;
      display: flex;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid #30303d;
      background: #09090f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #00ffff;
      box-shadow: 0 0 12px rgba(0, 255, 255, 0.35);
    }

    #sendBtn {
      width: 110px;
      border: none;
      border-radius: 13px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(
        90deg,
        #ff0066,
        #ff00ff,
        #0066ff,
        #00ffff
      );
      background-size: 300%;
      animation: buttonRGB 4s linear infinite;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    @keyframes buttonRGB {
      0% { background-position: 0%; }
      100% { background-position: 300%; }
    }

    .typing {
      color: #888;
      font-size: 14px;
      padding: 5px;
    }

    @media (max-width: 600px) {
      .app {
        min-height: 600px;
      }

      #chat {
        height: 390px;
      }

      .input-area {
        flex-direction: column;
      }

      #sendBtn {
        width: 100%;
        padding: 15px;
      }

      .bubble {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>Amzo AI</h1>
      <p>Your AI assistant</p>
    </div>

    <div id="chat">
      <div class="message ai">
        <div class="bubble">
          Hey! 👋 I'm Amzo AI. Ask me anything!
        </div>
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Message Amzo AI..."
        autocomplete="off"
      >

      <button id="sendBtn" onclick="sendMessage()">
        Send
      </button>
    </div>

  </div>

  <script>
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("sendBtn");

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";
      sendBtn.disabled = true;
      sendBtn.textContent = "Thinking...";

      const typing = document.createElement("div");
      typing.className = "message ai";
      typing.id = "typing";
      typing.innerHTML = '<div class="typing">🤖 AI is thinking...</div>';

      chat.appendChild(typing);
      chat.scrollTop = chat.scrollHeight;

      try {

        const response = await fetch(
          "https://ai-tool-api.amzoxamzoo.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              topic: message
            })
          }
        );

        const data = await response.json();

        document.getElementById("typing").remove();

        if (data.result) {
          addMessage(data.result, "ai");
        } else if (data.error) {
          addMessage("Error: " + data.error, "ai");
        } else {
          addMessage("Something went wrong.", "ai");
        }

      } catch (error) {

        const typingElement = document.getElementById("typing");

        if (typingElement) {
          typingElement.remove();
        }

        addMessage(
          "Could not connect to the AI server.",
          "ai"
        );
      }

      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      input.focus();
    }
  </script>

</body>
</html>
