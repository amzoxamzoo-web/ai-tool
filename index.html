<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#05050a;
  --panel:rgba(12,12,21,.78);
  --panel2:rgba(255,255,255,.055);
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:#9b9baa;
  --purple:#8b5cff;
  --blue:#00aaff;
  --pink:#ff1680;
}

body{
  min-height:100vh;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

/* ================= RGB BACKGROUND ================= */

.rgb-bg{
  position:fixed;
  inset:-30%;
  z-index:-5;
  background:
    radial-gradient(circle at 15% 25%,rgba(255,0,100,.25),transparent 22%),
    radial-gradient(circle at 85% 20%,rgba(0,140,255,.24),transparent 24%),
    radial-gradient(circle at 50% 90%,rgba(130,0,255,.25),transparent 25%);
  filter:blur(65px);
  animation:rgbMove 12s ease-in-out infinite alternate;
}

@keyframes rgbMove{
  0%{
    transform:translate(-4%,-3%) rotate(0deg) scale(1);
  }
  50%{
    transform:translate(4%,3%) rotate(7deg) scale(1.08);
  }
  100%{
    transform:translate(-2%,5%) rotate(-6deg) scale(1.02);
  }
}

.rgb-line{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:50;
  border:1px solid transparent;
  box-shadow:
    inset 0 0 35px rgba(255,0,120,.35),
    inset 0 0 65px rgba(0,130,255,.18);
  animation:rgbBorder 5s linear infinite;
}

@keyframes rgbBorder{
  0%{
    box-shadow:
      inset 0 0 30px #ff006a,
      inset 0 0 70px rgba(255,0,100,.15);
  }
  33%{
    box-shadow:
      inset 0 0 30px #009dff,
      inset 0 0 70px rgba(0,157,255,.15);
  }
  66%{
    box-shadow:
      inset 0 0 30px #8a00ff,
      inset 0 0 70px rgba(138,0,255,.15);
  }
  100%{
    box-shadow:
      inset 0 0 30px #ff006a,
      inset 0 0 70px rgba(255,0,100,.15);
  }
}

/* ================= APP ================= */

.app{
  height:100vh;
  display:flex;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:275px;
  flex-shrink:0;
  padding:18px;
  background:rgba(6,6,12,.82);
  backdrop-filter:blur(22px);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:25px;
  font-weight:900;
  margin-bottom:20px;
  letter-spacing:-1px;
  animation:logoGlow 5s linear infinite;
}

@keyframes logoGlow{
  0%{text-shadow:0 0 18px #ff006a}
  33%{text-shadow:0 0 18px #009dff}
  66%{text-shadow:0 0 18px #8a00ff}
  100%{text-shadow:0 0 18px #ff006a}
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:linear-gradient(
    135deg,
    rgba(139,92,255,.18),
    rgba(0,170,255,.08)
  );
  color:#fff;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
}

.new-chat:hover{
  transform:translateY(-2px);
  box-shadow:0 0 25px rgba(120,70,255,.3);
}

.sidebar-title{
  margin:25px 4px 9px;
  color:#777784;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.chat-list{
  flex:1;
  overflow:auto;
}

.chat-item{
  position:relative;
  padding:11px 32px 11px 11px;
  margin-bottom:5px;
  border-radius:10px;
  color:#bbb;
  cursor:pointer;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover,
.chat-item.active{
  background:rgba(255,255,255,.07);
  color:#fff;
}

.chat-delete{
  position:absolute;
  right:7px;
  top:8px;
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer;
  opacity:0;
}

.chat-item:hover .chat-delete{
  opacity:1;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-btn{
  width:100%;
  padding:10px;
  margin-top:6px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#aaa;
  text-align:left;
  cursor:pointer;
}

.side-btn:hover{
  background:rgba(255,255,255,.06);
  color:#fff;
}

/* ================= MAIN ================= */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:64px;
  flex-shrink:0;
  padding:0 22px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,5,10,.55);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}

.top-title{
  font-weight:700;
}

.online{
  color:#55f39a;
  font-size:12px;
}

/* ================= CONTENT ================= */

.content{
  flex:1;
  overflow-y:auto;
  padding:35px max(18px,7%);
}

.welcome{
  max-width:950px;
  margin:3vh auto 35px;
  text-align:center;
}

.welcome h1{
  font-size:48px;
  letter-spacing:-2px;
  margin-bottom:12px;
  animation:titleRGB 5s linear infinite;
}

@keyframes titleRGB{
  0%{text-shadow:0 0 20px #ff006a}
  33%{text-shadow:0 0 20px #009dff}
  66%{text-shadow:0 0 20px #8a00ff}
  100%{text-shadow:0 0 20px #ff006a}
}

.welcome p{
  color:var(--muted);
  font-size:15px;
}

/* ================= QUICK CARDS ================= */

.quick-grid{
  max-width:950px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.quick{
  padding:18px;
  text-align:left;
  border:1px solid var(--border);
  border-radius:15px;
  background:rgba(255,255,255,.045);
  color:#fff;
  cursor:pointer;
  transition:.25s;
}

.quick:hover{
  transform:translateY(-4px);
  background:rgba(255,255,255,.075);
  box-shadow:0 0 25px rgba(100,80,255,.15);
}

.quick-icon{
  font-size:25px;
  margin-bottom:10px;
}

.quick strong{
  display:block;
  margin-bottom:5px;
}

.quick span{
  color:#858592;
  font-size:12px;
}

/* ================= MESSAGES ================= */

.message{
  max-width:900px;
  margin:0 auto 18px;
  padding:15px 17px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
}

.user{
  background:rgba(255,255,255,.075);
}

.ai{
  background:rgba(13,13,22,.82);
  border:1px solid rgba(255,255,255,.075);
}

.actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

.small{
  padding:6px 9px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#aaa;
  cursor:pointer;
}

.small:hover{
  color:#fff;
}

/* ================= IMAGE CARD ================= */

.image-card{
  max-width:900px;
  margin:0 auto 20px;
  padding:13px;
  border-radius:18px;
  background:rgba(10,10,18,.86);
  border:1px solid var(--border);
  box-shadow:0 0 35px rgba(100,40,255,.12);
}

.image-card img{
  display:block;
  width:100%;
  max-height:620px;
  object-fit:contain;
  border-radius:12px;
  background:#050509;
}

.image-info{
  color:#888;
  font-size:12px;
  margin-top:10px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.image-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

/* ================= THINKING ================= */

.thinking{
  max-width:900px;
  margin:0 auto 18px;
  display:flex;
  gap:5px;
  padding:15px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
  animation:dot 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
  0%,100%{
    opacity:.2;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* ================= COMPOSER ================= */

.composer-area{
  flex-shrink:0;
  padding:10px max(18px,7%) 18px;
  background:linear-gradient(
    transparent,
    rgba(5,5,10,.7) 30%
  );
}

.modes{
  max-width:950px;
  margin:0 auto 9px;
  display:flex;
  gap:7px;
}

.mode{
  border:1px solid var(--border);
  background:rgba(255,255,255,.045);
  color:#999;
  padding:7px 12px;
  border-radius:9px;
  cursor:pointer;
}

.mode.active{
  color:#fff;
  background:rgba(130,80,255,.18);
  box-shadow:0 0 15px rgba(130,80,255,.15);
}

.image-panel{
  max-width:950px;
  margin:0 auto 9px;
  display:none;
  padding:12px;
  border:1px solid var(--border);
  border-radius:14px;
  background:rgba(10,10,18,.92);
}

.image-panel.show{
  display:block;
}

.image-row{
  display:flex;
  gap:8px;
}

.image-input,
.select{
  min-width:0;
  padding:11px;
  border-radius:9px;
  border:1px solid var(--border);
  outline:none;
  background:#090910;
  color:#fff;
}

.image-input{
  flex:1;
}

.generate{
  padding:11px 15px;
  border:0;
  border-radius:9px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(
    120deg,
    #ff0077,
    #7b00ff,
    #008cff
  );
  background-size:200% 200%;
  animation:gradient 4s ease infinite;
}

@keyframes gradient{
  0%{background-position:0 50%}
  50%{background-position:100% 50%}
  100%{background-position:0 50%}
}

.composer{
  max-width:950px;
  margin:0 auto;
  display:flex;
  gap:8px;
  padding:8px;
  border:1px solid var(--border);
  border-radius:17px;
  background:rgba(12,12,20,.88);
  box-shadow:0 0 30px rgba(0,0,0,.3);
}

textarea{
  flex:1;
  min-height:48px;
  max-height:150px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  padding:13px;
  font:inherit;
}

.send{
  width:50px;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#7b00ff,#008cff);
  color:#fff;
  cursor:pointer;
  transition:.2s;
}

.send:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #6500ff;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(450px,92vw);
  padding:22px;
  border-radius:18px;
  background:#101019;
  border:1px solid var(--border);
  box-shadow:0 0 50px rgba(100,50,255,.2);
}

.modal-box h2{
  margin-bottom:18px;
}

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  color:#ccc;
}

.modal-close{
  margin-top:17px;
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  color:#fff;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .welcome h1{
    font-size:35px;
  }

  .quick-grid{
    grid-template-columns:1fr;
  }

  .image-row{
    flex-wrap:wrap;
  }

  .image-input{
    flex-basis:100%;
  }

  .select,
  .generate{
    flex:1;
  }

  .content{
    padding:22px 12px;
  }

  .composer-area{
    padding:8px 10px 12px;
  }
}
</style>
</head>

<body>

<div class="rgb-bg"></div>
<div class="rgb-line"></div>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

  <div class="logo">⚡ Amzo AI</div>

  <button class="new-chat" onclick="newChat()">
    ＋ New Chat
  </button>

  <div class="sidebar-title">
    Recent Chats
  </div>

  <div id="chatList" class="chat-list"></div>

  <div class="sidebar-bottom">

    <button class="side-btn" onclick="showGallery()">
      🖼️ Image Gallery
    </button>

    <button class="side-btn" onclick="openSettings()">
      ⚙️ Settings
    </button>

  </div>

</aside>

<!-- ================= MAIN ================= -->

<main class="main">

<header class="topbar">

  <div class="top-title">
    <span id="topName">Amzo AI</span>
  </div>

  <div class="online">
    ● Online
  </div>

</header>

<section id="content" class="content"></section>

<!-- ================= COMPOSER ================= -->

<div class="composer-area">

  <div class="modes">

    <button
      id="chatMode"
      class="mode active"
      onclick="setMode('chat')"
    >
      💬 Chat
    </button>

    <button
      id="imageMode"
      class="mode"
      onclick="setMode('image')"
    >
      🖼️ Image
    </button>

  </div>

  <div id="imagePanel" class="image-panel">

    <div class="image-row">

      <input
        id="imagePrompt"
        class="image-input"
        placeholder="Describe the image you want..."
      >

      <select id="imageSize" class="select">

        <option value="1024x1024">
          1024 × 1024
        </option>

        <option value="1280x720">
          1280 × 720
        </option>

        <option value="720x1280">
          720 × 1280
        </option>

      </select>

      <button
        class="generate"
        onclick="generateImage()"
      >
        ✨ Generate
      </button>

    </div>

  </div>

  <div class="composer">

    <textarea
      id="input"
      placeholder="Message Amzo AI..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button
      class="send"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>

</main>
</div>

<!-- ================= SETTINGS ================= -->

<div id="settingsModal" class="modal">

  <div class="modal-box">

    <h2>⚙️ Settings</h2>

    <div class="setting">
      <span>RGB Animations</span>
      <input
        id="rgbToggle"
        type="checkbox"
        checked
        onchange="toggleRGB(this)"
      >
    </div>

    <div class="setting">
      <span>AI Speech</span>
      <input
        id="speechToggle"
        type="checkbox"
        checked
      >
    </div>

    <div class="setting">
      <span>Chat History</span>
      <button
        class="small"
        onclick="clearChats()"
      >
        Clear
      </button>
    </div>

    <div class="setting">
      <span>Image History</span>
      <button
        class="small"
        onclick="clearImages()"
      >
        Clear
      </button>
    </div>

    <button
      class="modal-close"
      onclick="closeSettings()"
    >
      Close
    </button>

  </div>

</div>

<script>

/* =====================================================
   CONFIG
===================================================== */

const API =
  "https://ai-tool-api.amzoxamzoo.workers.dev/";

/* =====================================================
   STATE
===================================================== */

let chats =
  JSON.parse(
    localStorage.getItem("amzo_chats") || "[]"
  );

let gallery =
  JSON.parse(
    localStorage.getItem("amzo_gallery") || "[]"
  );

let currentChat = null;
let mode = "chat";
let busy = false;

/* =====================================================
   STORAGE
===================================================== */

function saveChats(){

  localStorage.setItem(
    "amzo_chats",
    JSON.stringify(chats)
  );

}

function saveGallery(){

  localStorage.setItem(
    "amzo_gallery",
    JSON.stringify(gallery)
  );

}

/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  const chat = {
    id:Date.now(),
    name:"New Chat",
    messages:[]
  };

  chats.unshift(chat);

  currentChat = chat;

  saveChats();

  renderSidebar();
  render();

}

/* =====================================================
   AUTOMATIC CHAT NAME
===================================================== */

function autoRename(text){

  let name =
    text
      .replace(/\s+/g," ")
      .trim();

  if(!name)
    return "New Chat";

  if(name.length > 32)
    name =
      name.slice(0,32).trim() + "...";

  return name;

}

/* =====================================================
   RENDER SIDEBAR
===================================================== */

function renderSidebar(){

  const list =
    document.getElementById("chatList");

  list.innerHTML = "";

  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className =
      "chat-item " +
      (
        currentChat &&
        currentChat.id === chat.id
          ? "active"
          : ""
      );

    const title =
      document.createElement("span");

    title.textContent =
      chat.name;

    title.ondblclick = () =>
      renameChat(chat);

    const del =
      document.createElement("button");

    del.className =
      "chat-delete";

    del.textContent =
      "×";

    del.onclick = event => {

      event.stopPropagation();

      deleteChat(chat.id);

    };

    item.appendChild(title);
    item.appendChild(del);

    item.onclick = () => {

      currentChat = chat;

      renderSidebar();
      render();

    };

    list.appendChild(item);

  });

}

/* =====================================================
   RENAME
===================================================== */

function renameChat(chat){

  const name =
    prompt(
      "Enter chat name:",
      chat.name
    );

  if(!name)
    return;

  chat.name =
    name.trim().slice(0,50);

  saveChats();

  renderSidebar();

}

/* =====================================================
   DELETE CHAT
===================================================== */

function deleteChat(id){

  chats =
    chats.filter(
      chat => chat.id !== id
    );

  if(
    currentChat &&
    currentChat.id === id
  ){

    currentChat =
      chats[0] || null;

  }

  saveChats();

  renderSidebar();
  render();

}

/* =====================================================
   RENDER MAIN
===================================================== */

function render(){

  const content =
    document.getElementById("content");

  content.innerHTML = "";

  if(!currentChat){

    showWelcome();
    return;

  }

  document.getElementById("topName")
    .textContent =
      currentChat.name;

  if(
    currentChat.messages.length === 0
  ){

    showWelcome();
    return;

  }

  currentChat.messages.forEach(message => {

    if(message.type === "image"){

      addImageCard(
        message.image,
        message.prompt,
        false,
        message.id
      );

    }else{

      addMessage(
        message.type,
        message.text,
        false
      );

    }

  });

  scrollBottom();

}

/* =====================================================
   WELCOME
===================================================== */

function showWelcome(){

  const content =
    document.getElementById("content");

  content.innerHTML = `

    <div class="welcome">

      <h1>What can I help you with?</h1>

      <p>
        Chat, create images, learn, write and explore.
      </p>

    </div>

    <div class="quick-grid">

      <button
        class="quick"
        onclick="quickChat('Explain artificial intelligence in simple words.')"
      >
        <div class="quick-icon">🧠</div>
        <strong>Ask anything</strong>
        <span>Get an AI answer</span>
      </button>

      <button
        class="quick"
        onclick="quickImage()"
      >
        <div class="quick-icon">🖼️</div>
        <strong>Create an image</strong>
        <span>Turn your idea into an image</span>
      </button>

      <button
        class="quick"
        onclick="quickChat('Help me write something creative.')"
      >
        <div class="quick-icon">✍️</div>
        <strong>Write</strong>
        <span>Ideas, scripts and text</span>
      </button>

      <button
        class="quick"
        onclick="quickChat('Teach me something interesting today.')"
      >
        <div class="quick-icon">📚</div>
        <strong>Learn</strong>
        <span>Understand a new topic</span>
      </button>

      <button
        class="quick"
        onclick="quickChat('Give me a useful coding example and explain it.')"
      >
        <div class="quick-icon">💻</div>
        <strong>Coding</strong>
        <span>Build and understand code</span>
      </button>

      <button
        class="quick"
        onclick="quickChat('Give me three creative ideas for a project.')"
      >
        <div class="quick-icon">💡</div>
        <strong>Ideas</strong>
        <span>Explore new possibilities</span>
      </button>

    </div>
  `;

}

/* =====================================================
   QUICK CHAT
===================================================== */

function quickChat(text){

  if(!currentChat)
    newChat();

  document.getElementById("input")
    .value = text;

  sendMessage();

}

/* =====================================================
   QUICK IMAGE
===================================================== */

function quickImage(){

  setMode("image");

  document.getElementById("imagePrompt")
    .focus();

}

/* =====================================================
   MODE
===================================================== */

function setMode(newMode){

  mode = newMode;

  document.getElementById("chatMode")
    .classList.toggle(
      "active",
      mode === "chat"
    );

  document.getElementById("imageMode")
    .classList.toggle(
      "active",
      mode === "image"
    );

  document.getElementById("imagePanel")
    .classList.toggle(
      "show",
      mode === "image"
    );

}

/* =====================================================
   CHAT
===================================================== */

async function sendMessage(){

  if(mode !== "chat")
    return;

  if(busy)
    return;

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if(!text)
    return;

  if(!currentChat)
    newChat();

  if(
    currentChat.name === "New Chat"
  ){

    currentChat.name =
      autoRename(text);

  }

  currentChat.messages.push({
    type:"user",
    text
  });

  input.value = "";

  saveChats();
  renderSidebar();
  render();

  busy = true;

  const loading =
    document.createElement("div");

  loading.className =
    "thinking";

  loading.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  document
    .getElementById("content")
    .appendChild(loading);

  scrollBottom();

  try{

    const response =
      await fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          action:"chat",
          messages:
            currentChat.messages
        })
      });

    const data =
      await response.json();

    loading.remove();

    if(data.error){

      currentChat.messages.push({
        type:"ai",
        text:
          "Error: " +
          data.error
      });

    }else{

      currentChat.messages.push({
        type:"ai",
        text:
          data.result ||
          "No response received."
      });

    }

    saveChats();
    render();

  }catch(error){

    loading.remove();

    currentChat.messages.push({
      type:"ai",
      text:
        "Connection error. Please try again."
    });

    saveChats();
    render();

  }

  busy = false;

}

/* =====================================================
   MESSAGE
===================================================== */

function addMessage(
  type,
  text,
  scroll = true
){

  const content =
    document.getElementById("content");

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (
      type === "user"
        ? "user"
        : "ai"
    );

  div.textContent =
    text;

  if(type === "ai"){

    const actions =
      document.createElement("div");

    actions.className =
      "actions";

    const copy =
      document.createElement("button");

    copy.className =
      "small";

    copy.textContent =
      "📋 Copy";

    copy.onclick = () => {

      navigator.clipboard.writeText(
        text
      );

    };

    const speak =
      document.createElement("button");

    speak.className =
      "small";

    speak.textContent =
      "🔊 Speak";

    speak.onclick = () => {

      if(
        !document.getElementById(
          "speechToggle"
        )?.checked
      )
        return;

      speechSynthesis.cancel();

      const voice =
        new SpeechSynthesisUtterance(
          text
        );

      speechSynthesis.speak(
        voice
      );

    };

    actions.appendChild(copy);
    actions.appendChild(speak);

    div.appendChild(actions);

  }

  content.appendChild(div);

  if(scroll)
    scrollBottom();

}

/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(){

  if(busy)
    return;

  const prompt =
    document.getElementById(
      "imagePrompt"
    ).value.trim();

  if(!prompt){

    alert(
      "Write an image prompt first."
    );

    return;

  }

  if(!currentChat)
    newChat();

  const size =
    document.getElementById(
      "imageSize"
    ).value.split("x");

  const width =
    Number(size[0]);

  const height =
    Number(size[1]);

  busy = true;

  const content =
    document.getElementById("content");

  const loading =
    document.createElement("div");

  loading.className =
    "thinking";

  loading.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  content.appendChild(loading);

  scrollBottom();

  try{

    const response =
      await fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          action:"image",
          prompt,
          width,
          height
        })
      });

    const data =
      await response.json();

    loading.remove();

    if(data.error){

      addMessage(
        "ai",
        "Image error: " +
        data.error
      );

      busy = false;
      return;

    }

    let imageURL;

    if(
      typeof data.image === "string" &&
      data.image.startsWith("data:")
    ){

      imageURL =
        data.image;

    }else{

      imageURL =
        "data:" +
        (
          data.contentType ||
          "image/png"
        ) +
        ";base64," +
        data.image;

    }

    const imageID =
      Date.now();

    currentChat.messages.push({
      type:"image",
      id:imageID,
      image:imageURL,
      prompt
    });

    gallery.unshift({
      id:imageID,
      image:imageURL,
      prompt,
      date:
        new Date().toLocaleString()
    });

    saveChats();
    saveGallery();

    document.getElementById(
      "imagePrompt"
    ).value = "";

    render();

  }catch(error){

    loading.remove();

    addMessage(
      "ai",
      "Image generation failed: " +
      error.message
    );

  }

  busy = false;

}

/* =====================================================
   IMAGE CARD
===================================================== */

function addImageCard(
  imageURL,
  prompt,
  scroll = true,
  imageID = null
){

  const content =
    document.getElementById("content");

  const card =
    document.createElement("div");

  card.className =
    "image-card";

  const img =
    document.createElement("img");

  img.src =
    imageURL;

  const info =
    document.createElement("div");

  info.className =
    "image-info";

  info.textContent =
    prompt ||
    "Generated image";

  const actions =
    document.createElement("div");

  actions.className =
    "image-actions";

  const save =
    document.createElement("button");

  save.className =
    "small";

  save.textContent =
    "⬇️ Save";

  save.onclick = () => {

    const a =
      document.createElement("a");

    a.href =
      imageURL;

    a.download =
      "amzo-ai-image.png";

    a.click();

  };

  const open =
    document.createElement("button");

  open.className =
    "small";

  open.textContent =
    "🔍 Open";

  open.onclick = () =>
    window.open(
      imageURL,
      "_blank"
    );

  const deleteBtn =
    document.createElement("button");

  deleteBtn.className =
    "small";

  deleteBtn.textContent =
    "🗑️ Delete";

  deleteBtn.onclick = () => {

    deleteImage(
      imageID
    );

  };

  actions.appendChild(save);
  actions.appendChild(open);
  actions.appendChild(deleteBtn);

  card.appendChild(img);
  card.appendChild(info);
  card.appendChild(actions);

  content.appendChild(card);

  if(scroll)
    scrollBottom();

}

/* =====================================================
   DELETE IMAGE
===================================================== */

function deleteImage(id){

  if(!id)
    return;

  if(
    !confirm(
      "Delete this image?"
    )
  )
    return;

  if(currentChat){

    currentChat.messages =
      currentChat.messages.filter(
        m =>
          !(
            m.type === "image" &&
            m.id === id
          )
      );

  }

  gallery =
    gallery.filter(
      image =>
        image.id !== id
    );

  saveChats();
  saveGallery();

  render();

}

/* =====================================================
   GALLERY
===================================================== */

function showGallery(){

  const content =
    document.getElementById("content");

  content.innerHTML = `

    <div class="welcome">

      <h1>🖼️ Image Gallery</h1>

      <p>
        Your generated images
      </p>

    </div>

  `;

  if(!gallery.length){

    const empty =
      document.createElement("div");

    empty.className =
      "message ai";

    empty.textContent =
      "No generated images yet. Create your first one!";

    content.appendChild(empty);

    return;

  }

  gallery.forEach(image => {

    addImageCard(
      image.image,
      image.prompt,
      false,
      image.id
    );

  });

}

/* =====================================================
   CLEAR IMAGES
===================================================== */

function clearImages(){

  if(
    !confirm(
      "Delete all image history?"
    )
  )
    return;

  gallery = [];

  chats.forEach(chat => {

    chat.messages =
      chat.messages.filter(
        message =>
          message.type !== "image"
      );

  });

  saveGallery();
  saveChats();

  render();

}

/* =====================================================
   CLEAR CHATS
===================================================== */

function clearChats(){

  if(
    !confirm(
      "Delete all chats?"
    )
  )
    return;

  chats = [];
  currentChat = null;

  saveChats();

  renderSidebar();
  render();

}

/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  document
    .getElementById("settingsModal")
    .classList.add("show");

}

function closeSettings(){

  document
    .getElementById("settingsModal")
    .classList.remove("show");

}

/* =====================================================
   RGB TOGGLE
===================================================== */

function toggleRGB(input){

  const bg =
    document.querySelector(".rgb-bg");

  const line =
    document.querySelector(".rgb-line");

  if(input.checked){

    bg.style.display =
      "block";

    line.style.display =
      "block";

  }else{

    bg.style.display =
      "none";

    line.style.display =
      "none";

  }

}

/* =====================================================
   KEYBOARD
===================================================== */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}

/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

  const content =
    document.getElementById(
      "content"
    );

  setTimeout(() => {

    content.scrollTop =
      content.scrollHeight;

  },20);

}

/* =====================================================
   STARTUP
===================================================== */

if(chats.length){

  currentChat =
    chats[0];

}else{

  newChat();

}

renderSidebar();
render();

</script>
