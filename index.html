<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:#fff;
  min-height:100vh;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,0,120,.18),transparent 25%),
    radial-gradient(circle at 80% 20%,rgba(0,180,255,.18),transparent 25%),
    radial-gradient(circle at 50% 80%,rgba(120,0,255,.18),transparent 25%);
  filter:blur(50px);
  animation:rgb 12s linear infinite;
  z-index:-1;
}

@keyframes rgb{
  0%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(180deg) scale(1.15)}
  100%{transform:rotate(360deg) scale(1)}
}

.app{
  display:flex;
  height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:rgba(10,10,12,.92);
  border-right:1px solid #222;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px;
}

.newchat{
  width:100%;
  padding:12px;
  border:1px solid #333;
  border-radius:10px;
  background:#171719;
  color:white;
  cursor:pointer;
  font-size:15px;
}

.newchat:hover{background:#222}

.history-title{
  margin:25px 5px 10px;
  color:#888;
  font-size:12px;
  text-transform:uppercase;
}

.history{
  flex:1;
  overflow:auto;
}

.chat-item{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:4px;
}

.chat-item:hover,
.chat-item.active{
  background:#1b1b1f;
}

.chat-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
}

.chat-actions{
  display:none;
  gap:4px;
}

.chat-item:hover .chat-actions{
  display:flex;
}

.small-btn{
  border:0;
  background:transparent;
  color:#aaa;
  cursor:pointer;
  padding:3px;
}

.small-btn:hover{color:white}

.sidebar-bottom{
  border-top:1px solid #222;
  padding-top:12px;
}

.sidebar-btn{
  width:100%;
  border:0;
  background:transparent;
  color:#aaa;
  padding:10px;
  text-align:left;
  cursor:pointer;
  border-radius:8px;
}

.sidebar-btn:hover{
  background:#19191b;
  color:white;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.header{
  height:65px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  padding:0 25px;
  font-size:20px;
  font-weight:bold;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px 15%;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.empty h1{
  font-size:42px;
  margin-bottom:10px;
}

.empty p{
  color:#888;
}

/* MESSAGES */

.message{
  display:flex;
  margin-bottom:25px;
  gap:14px;
}

.avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
  background:#222;
}

.ai-avatar{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
}

.message-body{
  flex:1;
  min-width:0;
}

.message-role{
  font-size:13px;
  color:#888;
  margin-bottom:6px;
}

.message-text{
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.message-tools{
  display:flex;
  gap:6px;
  margin-top:8px;
}

.tool{
  background:#151515;
  border:1px solid #292929;
  color:#999;
  border-radius:7px;
  padding:5px 9px;
  cursor:pointer;
  font-size:12px;
}

.tool:hover{
  color:white;
  background:#202020;
}

/* INPUT */

.input-area{
  padding:15px 15%;
  border-top:1px solid #222;
  background:rgba(5,5,5,.8);
}

.input-box{
  border:1px solid #333;
  background:#111;
  border-radius:16px;
  padding:8px;
}

textarea{
  width:100%;
  resize:none;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-size:15px;
  padding:10px;
  min-height:45px;
  max-height:150px;
}

.input-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.left-tools{
  display:flex;
  gap:6px;
}

.icon-btn,
.send-btn{
  border:0;
  border-radius:9px;
  width:38px;
  height:38px;
  cursor:pointer;
}

.icon-btn{
  background:#191919;
  color:#aaa;
}

.icon-btn:hover{
  color:white;
  background:#252525;
}

.send-btn{
  background:white;
  color:black;
  font-weight:bold;
}

.send-btn:hover{
  background:#ddd;
}

.send-btn.stop{
  background:#ff4d4d;
  color:white;
}

.file-name{
  font-size:12px;
  color:#888;
  padding:3px 10px;
}

/* THINKING */

.thinking{
  display:flex;
  gap:5px;
  padding:5px 0;
}

.dot{
  width:7px;
  height:7px;
  background:#888;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,100%{transform:translateY(0);opacity:.4}
  50%{transform:translateY(-5px);opacity:1}
}

/* SETTINGS */

.settings{
  position:fixed;
  right:20px;
  top:75px;
  width:280px;
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:18px;
  display:none;
  z-index:10;
}

.settings.show{display:block}

.settings h3{
  margin-bottom:15px;
}

.setting{
  padding:12px 0;
  border-bottom:1px solid #222;
  color:#aaa;
  font-size:14px;
}

.setting:last-child{border-bottom:0}

.status{
  color:#43e97b;
}

/* MOBILE */

@media(max-width:800px){
  .sidebar{
    width:70px;
    padding:10px;
  }

  .logo{
    font-size:18px;
    text-align:center;
  }

  .newchat{
    font-size:0;
  }

  .newchat:after{
    content:"+";
    font-size:20px;
  }

  .history-title,
  .chat-name,
  .sidebar-bottom{
    display:none;
  }

  .chat-item{
    justify-content:center;
  }

  .chat-actions{
    display:none!important;
  }

  .chat{
    padding:20px 8%;
  }

  .input-area{
    padding:10px 5%;
  }

  .empty h1{
    font-size:30px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">⚡ Amzo AI</div>

    <button class="newchat" onclick="newChat()">＋ New Chat</button>

    <div class="history-title">Recent Chats</div>

    <div id="history" class="history"></div>

    <div class="sidebar-bottom">
      <button class="sidebar-btn" onclick="toggleSettings()">⚙ Settings</button>
      <button class="sidebar-btn" onclick="deleteAllChats()">🗑 Delete All</button>
    </div>

  </aside>

  <main class="main">

    <header class="header">
      Amzo AI
    </header>

    <section id="chat" class="chat"></section>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          placeholder="Message Amzo AI..."
          onkeydown="handleKey(event)"
        ></textarea>

        <div id="fileName" class="file-name"></div>

        <div class="input-row">

          <div class="left-tools">

            <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">
              📎
            </button>

            <button class="icon-btn" onclick="startVoice()" title="Voice input">
              🎤
            </button>

            <input
              id="fileInput"
              type="file"
              accept="image/*,.txt,.pdf"
              hidden
              onchange="fileSelected(event)"
            >

          </div>

          <button id="sendBtn" class="send-btn" onclick="handleSend()">
            ➤
          </button>

        </div>

      </div>

    </div>

  </main>

</div>

<div id="settings" class="settings">

  <h3>Settings</h3>

  <div class="setting">
    AI Status:
    <span class="status">● Online</span>
  </div>

  <div class="setting">
    Memory: Recent conversation enabled
  </div>

  <div class="setting">
    Theme: Dark
  </div>

  <div class="setting">
    Voice: Browser supported
  </div>

</div>

<script>

const API_URL =
"https://ai-tool-api.amzoxamzoo.workers.dev/";

let chats =
JSON.parse(localStorage.getItem("amzo_chats") || "[]");

let selectedId = null;
let generating = false;
let controller = null;
let selectedFile = null;


/* SAVE */

function saveChats(){
  localStorage.setItem(
    "amzo_chats",
    JSON.stringify(chats)
  );
}


/* NEW CHAT */

function newChat(){

  selectedId = null;

  document.getElementById("input").value = "";

  render();

}


/* SELECT CHAT */

function selectChat(id){

  selectedId = id;

  render();

}


/* DELETE CHAT */

function deleteChat(id){

  chats = chats.filter(c => c.id !== id);

  if(selectedId === id){
    selectedId = null;
  }

  saveChats();
  render();

}


/* DELETE ALL */

function deleteAllChats(){

  if(!chats.length) return;

  if(confirm("Delete all chats?")){

    chats = [];
    selectedId = null;

    saveChats();
    render();

  }

}


/* RENAME */

function renameChat(id){

  const chat = chats.find(c => c.id === id);

  if(!chat) return;

  const name =
  prompt("Enter new chat name:", chat.title);

  if(name && name.trim()){

    chat.title = name.trim();

    saveChats();
    render();

  }

}


/* CURRENT CHAT */

function currentChat(){

  return chats.find(c => c.id === selectedId);

}


/* RENDER */

function render(){

  renderHistory();
  renderMessages();

}


/* HISTORY */

function renderHistory(){

  const history =
  document.getElementById("history");

  history.innerHTML = "";

  chats.slice().reverse().forEach(chat => {

    const item =
    document.createElement("div");

    item.className =
    "chat-item " +
    (chat.id === selectedId ? "active" : "");

    item.onclick =
    () => selectChat(chat.id);

    const name =
    document.createElement("div");

    name.className = "chat-name";
    name.textContent = chat.title;

    const actions =
    document.createElement("div");

    actions.className = "chat-actions";

    const rename =
    document.createElement("button");

    rename.className = "small-btn";
    rename.textContent = "✎";

    rename.onclick = e => {

      e.stopPropagation();
      renameChat(chat.id);

    };

    const del =
    document.createElement("button");

    del.className = "small-btn";
    del.textContent = "×";

    del.onclick = e => {

      e.stopPropagation();
      deleteChat(chat.id);

    };

    actions.append(rename,del);

    item.append(name,actions);

    history.appendChild(item);

  });

}


/* MESSAGES */

function renderMessages(){

  const chat =
  document.getElementById("chat");

  chat.innerHTML = "";

  const selected =
  currentChat();

  if(!selected){

    chat.innerHTML = `
      <div class="empty">
        <h1>⚡ Amzo AI</h1>
        <p>Ask anything. Build anything.</p>
      </div>
    `;

    return;

  }

  selected.messages.forEach((msg,index) => {

    addMessageElement(
      msg.type,
      msg.text,
      index,
      false
    );

  });

  chat.scrollTop = chat.scrollHeight;

}


/* ADD MESSAGE */

function addMessageElement(
  type,
  text,
  index,
  typing
){

  const chat =
  document.getElementById("chat");

  const wrapper =
  document.createElement("div");

  wrapper.className = "message";

  const avatar =
  document.createElement("div");

  avatar.className =
  "avatar " +
  (type === "ai" ? "ai-avatar" : "");

  avatar.textContent =
  type === "ai" ? "AI" : "You";

  const body =
  document.createElement("div");

  body.className = "message-body";

  const role =
  document.createElement("div");

  role.className = "message-role";

  role.textContent =
  type === "ai" ? "Amzo AI" : "You";

  const content =
  document.createElement("div");

  content.className = "message-text";

  content.textContent = text;

  body.append(role,content);

  if(type === "ai"){

    const tools =
    document.createElement("div");

    tools.className = "message-tools";

    const copy =
    document.createElement("button");

    copy.className = "tool";
    copy.textContent = "Copy";

    copy.onclick =
    () => copyText(text);

    const speak =
    document.createElement("button");

    speak.className = "tool";
    speak.textContent = "🔊 Speak";

    speak.onclick =
    () => speakText(text);

    const regen =
    document.createElement("button");

    regen.className = "tool";
    regen.textContent = "↻ Regenerate";

    regen.onclick =
    () => regenerate(index);

    tools.append(copy,speak,regen);

    body.appendChild(tools);

  }

  wrapper.append(avatar,body);

  chat.appendChild(wrapper);

}


/* SEND */

async function sendMessage(){

  const input =
  document.getElementById("input");

  const text =
  input.value.trim();

  if(!text || generating) return;


  let selected =
  currentChat();


  if(!selected){

    const id =
    Date.now().toString();

    selected = {

      id:id,

      title:
      text.slice(0,35) +
      (text.length > 35 ? "..." : ""),

      messages:[]

    };

    chats.push(selected);

    selectedId = id;

  }


  selected.messages.push({

    type:"user",
    text:text

  });

  input.value = "";

  if(selectedFile){

    selected.messages[
      selected.messages.length - 1
    ].text +=
    "\n[Attached: " +
    selectedFile.name +
    "]";

  }


  selectedFile = null;

  document.getElementById(
    "fileName"
  ).textContent = "";


  saveChats();
  render();


  generating = true;

  controller =
  new AbortController();

  updateSendButton();


  const thinking =
  document.createElement("div");

  thinking.className = "message";

  thinking.innerHTML = `
    <div class="avatar ai-avatar">AI</div>
    <div class="message-body">
      <div class="message-role">Amzo AI</div>
      <div class="thinking">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  `;

  document.getElementById(
    "chat"
  ).appendChild(thinking);


  try{

    const response =
    await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        messages:
        selected.messages

      }),

      signal:
      controller.signal

    });


    const data =
    await response.json();


    thinking.remove();


    if(data.error){

      throw new Error(data.error);

    }


    const answer =
    data.result ||
    "I couldn't generate a response.";


    selected.messages.push({

      type:"ai",
      text:answer

    });


    saveChats();

    render();


    /* SPEAK OPTION IS MANUAL */

  }

  catch(error){

    thinking.remove();

    if(error.name !== "AbortError"){

      selected.messages.push({

        type:"ai",

        text:
        "Error: " +
        error.message

      });

      saveChats();
      render();

    }

  }

  finally{

    generating = false;
    controller = null;

    updateSendButton();

  }

}


/* REGENERATE */

async function regenerate(index){

  if(generating) return;

  const selected =
  currentChat();

  if(!selected) return;

  const aiMessage =
  selected.messages[index];

  if(!aiMessage ||
     aiMessage.type !== "ai") return;


  const previousUser =
  selected.messages[index - 1];

  if(!previousUser ||
     previousUser.type !== "user") return;


  selected.messages.splice(index,1);

  saveChats();
  render();


  generating = true;

  controller =
  new AbortController();

  updateSendButton();


  try{

    const response =
    await fetch(API_URL,{

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        messages:
        selected.messages

      }),

      signal:
      controller.signal

    });


    const data =
    await response.json();


    if(data.error)
      throw new Error(data.error);


    selected.messages.push({

      type:"ai",
      text:
      data.result ||
      "No response."

    });


    saveChats();
    render();

  }

  catch(error){

    if(error.name !== "AbortError"){

      selected.messages.push({

        type:"ai",

        text:
        "Error: " +
        error.message

      });

      saveChats();
      render();

    }

  }

  finally{

    generating = false;
    controller = null;

    updateSendButton();

  }

}


/* STOP */

function stopGeneration(){

  if(controller){

    controller.abort();

  }

  generating = false;

  updateSendButton();

}


/* BUTTON */

function handleSend(){

  if(generating){

    stopGeneration();

  }else{

    sendMessage();

  }

}


/* BUTTON STATE */

function updateSendButton(){

  const btn =
  document.getElementById("sendBtn");

  if(generating){

    btn.textContent = "■";
    btn.classList.add("stop");

  }else{

    btn.textContent = "➤";
    btn.classList.remove("stop");

  }

}


/* KEYBOARD */

function handleKey(event){

  if(event.key === "Enter" &&
     !event.shiftKey){

    event.preventDefault();

    handleSend();

  }

}


/* COPY */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

  }catch{

    const area =
    document.createElement("textarea");

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

  }

}


/* SPEAK */

function speakText(text){

  if(!("speechSynthesis" in window)){

    alert("Voice is not supported in this browser.");

    return;

  }

  speechSynthesis.cancel();

  const speech =
  new SpeechSynthesisUtterance(text);

  speech.lang =
  /[\u0600-\u06FF]/.test(text)
  ? "ur-PK"
  : "en-US";

  speech.rate = 1;

  speechSynthesis.speak(speech);

}


/* VOICE INPUT */

function startVoice(){

  const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

  if(!Recognition){

    alert(
      "Voice input is not supported in this browser."
    );

    return;

  }

  const recognition =
  new Recognition();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.start();


  recognition.onresult =
  event => {

    const result =
    event.results[0][0].transcript;

    document.getElementById(
      "input"
    ).value += result;

  };


  recognition.onerror =
  () => {

    alert("Voice input failed.");

  };

}


/* FILE */

function fileSelected(event){

  const file =
  event.target.files[0];

  if(!file) return;

  selectedFile = file;

  document.getElementById(
    "fileName"
  ).textContent =
  "📎 " + file.name;

}


/* SETTINGS */

function toggleSettings(){

  document.getElementById(
    "settings"
  ).classList.toggle("show");

}


/* START */

render();

</script>

</body>
</html>
