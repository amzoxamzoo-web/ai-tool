<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 20%,#ff0055,transparent 25%),
    radial-gradient(circle at 80% 20%,#0066ff,transparent 25%),
    radial-gradient(circle at 50% 80%,#00ff99,transparent 25%);
  filter:blur(100px);
  opacity:.25;
  animation:bgMove 12s infinite alternate;
  z-index:-1;
}

@keyframes bgMove{
  from{transform:rotate(0deg) scale(1)}
  to{transform:rotate(15deg) scale(1.15)}
}

.app{
  display:flex;
  height:100vh;
}

.sidebar{
  width:260px;
  background:rgba(10,10,10,.88);
  border-right:1px solid #222;
  padding:15px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:24px;
  font-weight:bold;
  margin-bottom:20px;
}

.new-chat{
  width:100%;
  padding:12px;
  border:1px solid #333;
  border-radius:10px;
  background:#151515;
  color:white;
  cursor:pointer;
  margin-bottom:15px;
}

.new-chat:hover{
  background:#222;
}

.recent-title{
  font-size:12px;
  color:#888;
  margin-bottom:8px;
}

.chat-list{
  overflow-y:auto;
  flex:1;
}

.chat-item{
  padding:10px;
  border-radius:8px;
  margin-bottom:5px;
  cursor:pointer;
  color:#ccc;
  display:flex;
  justify-content:space-between;
  gap:5px;
}

.chat-item:hover,
.chat-item.active{
  background:#1c1c1c;
  color:white;
}

.chat-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  flex:1;
}

.chat-actions{
  display:none;
}

.chat-item:hover .chat-actions{
  display:flex;
}

.chat-actions button{
  border:0;
  background:none;
  color:#888;
  cursor:pointer;
}

.chat-actions button:hover{
  color:white;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:65px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(5,5,5,.75);
}

.title{
  font-size:20px;
  font-weight:bold;
}

.settings-btn{
  border:1px solid #333;
  background:#111;
  color:white;
  padding:9px 12px;
  border-radius:8px;
  cursor:pointer;
}

.settings-btn:hover{
  background:#222;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:30px 8%;
}

.message{
  max-width:850px;
  margin:0 auto 20px;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  padding:14px 16px;
  border-radius:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#2563eb;
  max-width:75%;
}

.ai .bubble{
  background:#171717;
  border:1px solid #292929;
  max-width:80%;
}

.ai-actions{
  margin-top:8px;
  display:flex;
  gap:6px;
}

.ai-actions button{
  background:#111;
  color:#aaa;
  border:1px solid #333;
  border-radius:7px;
  padding:5px 8px;
  cursor:pointer;
}

.ai-actions button:hover{
  color:white;
}

.thinking{
  display:flex;
  gap:5px;
  align-items:center;
}

.dot{
  width:7px;
  height:7px;
  background:#aaa;
  border-radius:50%;
  animation:dot 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
  0%,100%{opacity:.2}
  50%{opacity:1}
}

.input-area{
  padding:15px 8%;
  border-top:1px solid #222;
  background:rgba(5,5,5,.85);
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:#111;
  border:1px solid #333;
  border-radius:14px;
  padding:8px;
}

textarea{
  flex:1;
  resize:none;
  min-height:44px;
  max-height:150px;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:12px;
  font-size:15px;
  font-family:inherit;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:10px;
  border:1px solid #333;
  background:#181818;
  color:white;
  cursor:pointer;
}

.icon-btn:hover{
  background:#252525;
}

.send{
  background:#2563eb;
  border-color:#2563eb;
}

.send:hover{
  background:#1d4ed8;
}

.stop{
  background:#8b0000;
  border-color:#8b0000;
  display:none;
}

.settings-panel{
  position:fixed;
  right:20px;
  top:75px;
  width:300px;
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:18px;
  display:none;
  z-index:10;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.settings-panel.show{
  display:block;
}

.settings-panel h3{
  margin-bottom:15px;
}

.setting{
  padding:12px 0;
  border-bottom:1px solid #222;
  color:#bbb;
}

.online{
  color:#00ff88;
}

.mobile-menu{
  display:none;
}

@media(max-width:700px){

.sidebar{
  position:fixed;
  left:-270px;
  top:0;
  bottom:0;
  z-index:20;
  transition:.25s;
}

.sidebar.open{
  left:0;
}

.mobile-menu{
  display:block;
  border:1px solid #333;
  background:#111;
  color:white;
  padding:8px 10px;
  border-radius:8px;
}

.messages{
  padding:20px 12px;
}

.input-area{
  padding:10px;
}

.user .bubble,
.ai .bubble{
  max-width:90%;
}
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar" id="sidebar">

    <div class="logo">🤖 Amzo AI</div>

    <button class="new-chat" onclick="newChat()">
      + New Chat
    </button>

    <div class="recent-title">
      RECENT CHATS
    </div>

    <div class="chat-list" id="chatList"></div>

  </aside>

  <main class="main">

    <div class="topbar">

      <div style="display:flex;align-items:center;gap:10px">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()"
        >
          ☰
        </button>

        <div class="title">
          Amzo AI
        </div>

      </div>

      <button
        class="settings-btn"
        onclick="toggleSettings()"
      >
        ⚙ Settings
      </button>

    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="input"
          placeholder="Message Amzo AI..."
          rows="1"
        ></textarea>

        <button
          class="icon-btn"
          id="micBtn"
          onclick="startVoice()"
          title="Voice input"
        >
          🎤
        </button>

        <button
          class="icon-btn send"
          id="sendBtn"
          onclick="sendMessage()"
          title="Send"
        >
          ➤
        </button>

        <button
          class="icon-btn stop"
          id="stopBtn"
          onclick="stopGeneration()"
          title="Stop"
        >
          ■
        </button>

      </div>

      <div style="
        text-align:center;
        color:#666;
        font-size:11px;
        margin-top:8px;
      ">
        Enter = Send • Shift + Enter = New line
      </div>

    </div>

  </main>

</div>

<div class="settings-panel" id="settingsPanel">

  <h3>⚙ Settings</h3>

  <div class="setting">
    🟢 AI Status:
    <span class="online">Online</span>
  </div>

  <div class="setting">
    🧠 Memory:
    Recent chat enabled
  </div>

  <div class="setting">
    🎤 Voice Input:
    Browser Speech Recognition
  </div>

  <div class="setting">
    🔊 AI Voice:
    Browser Speech Synthesis
  </div>

</div>

<script>

const API_URL =
"https://ai-tool-api.amzoxamzoo.workers.dev/";

let chats =
JSON.parse(localStorage.getItem("amzo_chats") || "[]");

let selected =
Number(localStorage.getItem("amzo_selected") || 0);

let controller = null;


/* =========================
   CHAT STORAGE
========================= */

function saveChats(){

localStorage.setItem(
"amzo_chats",
JSON.stringify(chats)
);

localStorage.setItem(
"amzo_selected",
selected
);

}


/* =========================
   CREATE CHAT
========================= */

function newChat(){

chats.unshift({

name:"New Chat",

messages:[]

});

selected=0;

saveChats();

renderChatList();

renderMessages();

document.getElementById("input").focus();

}


/* =========================
   CURRENT CHAT
========================= */

function currentChat(){

if(!chats.length){

chats.push({
name:"New Chat",
messages:[]
});

}

if(!chats[selected]){
selected=0;
}

return chats[selected];

}


/* =========================
   CHAT LIST
========================= */

function renderChatList(){

const list =
document.getElementById("chatList");

list.innerHTML="";

chats.forEach((chat,index)=>{

const item =
document.createElement("div");

item.className =
"chat-item " +
(index===selected ? "active" : "");

item.innerHTML = `

<div
class="chat-name"
onclick="selectChat(${index})"
>
${escapeHtml(chat.name)}
</div>

<div class="chat-actions">

<button
onclick="renameChat(event,${index})"
>
✏
</button>

<button
onclick="deleteChat(event,${index})"
>
🗑
</button>

</div>

`;

list.appendChild(item);

});

}


function selectChat(index){

selected=index;

saveChats();

renderChatList();

renderMessages();

closeSidebar();

}


/* =========================
   RENAME CHAT
========================= */

function renameChat(event,index){

event.stopPropagation();

const name =
prompt(
"Enter new chat name:",
chats[index].name
);

if(name && name.trim()){

chats[index].name =
name.trim();

saveChats();

renderChatList();

}

}


/* =========================
   DELETE CHAT
========================= */

function deleteChat(event,index){

event.stopPropagation();

if(!confirm("Delete this chat?")){
return;
}

chats.splice(index,1);

if(!chats.length){

chats.push({
name:"New Chat",
messages:[]
});

}

if(selected>=chats.length){
selected=chats.length-1;
}

saveChats();

renderChatList();

renderMessages();

}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(){

const box =
document.getElementById("messages");

box.innerHTML="";

const chat =
currentChat();

if(!chat.messages.length){

const welcome =
document.createElement("div");

welcome.style.textAlign="center";
welcome.style.color="#777";
welcome.style.marginTop="80px";

welcome.innerHTML = `
<div style="font-size:42px;margin-bottom:10px">
🤖
</div>
<h2 style="color:white;margin-bottom:8px">
Amzo AI
</h2>
<p>
Ask me anything.
</p>
`;

box.appendChild(welcome);

return;

}

chat.messages.forEach((message,index)=>{

addMessageToScreen(
message.type,
message.text,
index
);

});

scrollBottom();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessageToScreen(
type,
text,
index=-1
){

const box =
document.getElementById("messages");

const row =
document.createElement("div");

row.className =
"message " +
(type==="user" ? "user" : "ai");

const bubble =
document.createElement("div");

bubble.className="bubble";

bubble.textContent=text;

row.appendChild(bubble);

if(type==="ai" && index>=0){

const actions =
document.createElement("div");

actions.className="ai-actions";

actions.innerHTML=`

<button onclick="copyMessage(${index})">
📋 Copy
</button>

<button onclick="speakMessage(${index})">
🔊 Speak
</button>

`;

bubble.appendChild(actions);

}

box.appendChild(row);

}


/* =========================
   THINKING
========================= */

function showThinking(){

const box =
document.getElementById("messages");

const row =
document.createElement("div");

row.className="message ai";

row.id="thinkingMessage";

row.innerHTML=`

<div class="bubble thinking">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

`;

box.appendChild(row);

scrollBottom();

}


function removeThinking(){

const thinking =
document.getElementById("thinkingMessage");

if(thinking){
thinking.remove();
}

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

const input =
document.getElementById("input");

const text =
input.value.trim();

if(!text){
return;
}

const chat =
currentChat();

if(!chat.messages.length){

chat.name =
text.slice(0,35);

}

chat.messages.push({

type:"user",

text:text

});

input.value="";

saveChats();

renderChatList();

renderMessages();

showThinking();

document.getElementById("sendBtn").style.display="none";

document.getElementById("stopBtn").style.display="block";

controller =
new AbortController();

try{

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

messages:
chat.messages.slice(-16)

}),

signal:
controller.signal

});

const data =
await response.json();

removeThinking();

if(!response.ok){

throw new Error(
data.error ||
"AI request failed"
);

}

const answer =
data.result ||
"No response received.";

chat.messages.push({

type:"assistant",

text:answer

});

saveChats();

renderMessages();

}catch(error){

removeThinking();

if(error.name!=="AbortError"){

chat.messages.push({

type:"assistant",

text:
"Error: " +
error.message

});

saveChats();

renderMessages();

}

}

document.getElementById("sendBtn").style.display="block";

document.getElementById("stopBtn").style.display="none";

controller=null;

}


/* =========================
   STOP
========================= */

function stopGeneration(){

if(controller){

controller.abort();

controller=null;

}

document.getElementById("sendBtn").style.display="block";

document.getElementById("stopBtn").style.display="none";

removeThinking();

}


/* =========================
   COPY
========================= */

function copyMessage(index){

const chat =
currentChat();

const message =
chat.messages[index];

if(!message){
return;
}

navigator.clipboard.writeText(
message.text
);

}


/* =========================
   AI SPEAK
========================= */

function speakMessage(index){

const chat =
currentChat();

const message =
chat.messages[index];

if(!message){
return;
}

if(!("speechSynthesis" in window)){

alert(
"Your browser does not support AI voice."
);

return;

}

speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(
message.text
);

utterance.lang="en-US";

speechSynthesis.speak(
utterance
);

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Voice input is not supported by this browser. Try Google Chrome."
);

return;

}

const micButton =
document.getElementById("micBtn");

micButton.disabled=true;

micButton.textContent="🔴";


const recognition =
new SpeechRecognition();

recognition.lang="en-US";

recognition.continuous=false;

recognition.interimResults=false;

recognition.maxAlternatives=1;


/* START */

recognition.onstart=function(){

console.log(
"🎤 Speech recognition started"
);

};


/* RESULT */

recognition.onresult=function(event){

try{

const result =
event.results[0][0].transcript;

const input =
document.getElementById("input");

if(input.value.trim()){

input.value += " " + result;

}else{

input.value=result;

}

input.focus();

}catch(error){

console.error(
"Result error:",
error
);

}

};


/* ERROR */

recognition.onerror=function(event){

console.error(
"Speech recognition error:",
event.error
);

let message="Voice input failed.";

switch(event.error){

case "not-allowed":
case "permission-denied":

message =
"Chrome denied microphone access. Check the microphone permission for this website.";

break;


case "audio-capture":

message =
"No microphone was detected by Windows.";

break;


case "network":

message =
"Chrome's speech recognition service has a network/service problem.";

break;


case "service-not-allowed":

message =
"Chrome's speech recognition service is not available.";

break;


case "no-speech":

message =
"No speech detected. Speak after the microphone starts.";

break;


case "aborted":

message =
"Voice recognition was stopped.";

break;


default:

message =
"Voice error: " +
event.error;

}

alert(message);

};


/* END */

recognition.onend=function(){

console.log(
"🎤 Speech recognition ended"
);

micButton.disabled=false;

micButton.textContent="🎤";

};


/* START RECOGNITION */

try{

recognition.start();

}catch(error){

console.error(
"Could not start recognition:",
error
);

micButton.disabled=false;

micButton.textContent="🎤";

alert(
"Could not start microphone: " +
error.message
);

}

}


/* =========================
   ENTER SEND
========================= */

document
.getElementById("input")
.addEventListener(
"keydown",
function(event){

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}
);


/* =========================
   SETTINGS
========================= */

function toggleSettings(){

document
.getElementById("settingsPanel")
.classList.toggle("show");

}


/* =========================
   MOBILE SIDEBAR
========================= */

function toggleSidebar(){

document
.getElementById("sidebar")
.classList.toggle("open");

}

function closeSidebar(){

document
.getElementById("sidebar")
.classList.remove("open");

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

const box =
document.getElementById("messages");

box.scrollTop =
box.scrollHeight;

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* =========================
   INITIALIZE
========================= */

if(!chats.length){

chats.push({

name:"New Chat",

messages:[]

});

selected=0;

saveChats();

}

renderChatList();

renderMessages();

</script>

</body>
</html>
