<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

:root{
  --bg:#050509;
  --panel:#0c0c13;
  --panel2:#11111a;
  --border:#292936;
  --text:#fff;
  --muted:#888;
}

body{
  height:100vh;
  overflow:hidden;
  color:var(--text);
  background:var(--bg);
}

/* RGB BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:850px;
  height:850px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:conic-gradient(
    #ff0055,
    #ff00ff,
    #6200ff,
    #0088ff,
    #00ffff,
    #00ff66,
    #ffff00,
    #ff0055
  );
  filter:blur(180px);
  opacity:.11;
  animation:spin 12s linear infinite;
  z-index:-1;
}

@keyframes spin{
  to{
    transform:translate(-50%,-50%) rotate(360deg);
  }
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:rgba(8,8,14,.97);
  border-right:1px solid var(--border);
  padding:18px;
  display:flex;
  flex-direction:column;
}

.logo{
  font-size:25px;
  font-weight:bold;
  margin-bottom:20px;

  background:linear-gradient(
    90deg,
    #ff0055,
    #ff00ff,
    #0088ff,
    #00ffff,
    #00ff66,
    #ffff00
  );

  background-size:300%;
  -webkit-background-clip:text;
  color:transparent;
  animation:rgbText 4s linear infinite;
}

@keyframes rgbText{
  to{
    background-position:300%;
  }
}

.new-chat{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid transparent;
  color:white;
  background:
    linear-gradient(#101018,#101018) padding-box,
    linear-gradient(
      90deg,
      #ff0055,
      #ff00ff,
      #0088ff,
      #00ffff,
      #00ff66,
      #ffff00
    ) border-box;

  cursor:pointer;
  font-weight:bold;
  margin-bottom:20px;
}

.new-chat:hover{
  box-shadow:
    0 0 15px #ff00aa,
    0 0 25px #0088ff;
}

.history-title{
  color:#777;
  font-size:11px;
  margin-bottom:10px;
  text-transform:uppercase;
}

#history{
  flex:1;
  overflow-y:auto;
}

.chat-item{
  padding:11px;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
  display:flex;
  gap:6px;
  color:#ccc;
}

.chat-item:hover{
  background:#171720;
}

.chat-item.active{
  background:
    linear-gradient(
      90deg,
      rgba(255,0,85,.18),
      rgba(0,200,255,.18)
    );

  border-left:2px solid #00ffff;
}

.chat-name{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.actions{
  display:none;
  gap:4px;
}

.chat-item:hover .actions{
  display:flex;
}

.mini{
  border:0;
  background:transparent;
  color:#888;
  cursor:pointer;
}

.mini:hover{
  color:white;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  border-bottom:1px solid var(--border);
  background:rgba(8,8,13,.82);
  backdrop-filter:blur(12px);
}

.title{
  font-size:18px;
  font-weight:bold;

  background:linear-gradient(
    90deg,
    #ff0055,
    #ff00ff,
    #00ffff,
    #00ff66
  );

  background-size:250%;
  -webkit-background-clip:text;
  color:transparent;

  animation:rgbText 4s linear infinite;
}

.settings-btn{
  background:#11111a;
  border:1px solid #292936;
  color:#aaa;
  padding:8px 11px;
  border-radius:9px;
  cursor:pointer;
}

.settings-btn:hover{
  color:white;
  border-color:#00ffff;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:30px 8%;
}

.message{
  display:flex;
  flex-direction:column;
  margin-bottom:22px;
}

.message.user{
  align-items:flex-end;
}

.bubble{
  max-width:78%;
  padding:14px 17px;
  border-radius:16px;
  line-height:1.65;
  white-space:pre-wrap;
  word-break:break-word;
}

.ai .bubble{
  background:#12121b;
  border:1px solid #292936;
}

.user .bubble{
  background:
    linear-gradient(
      135deg,
      #ff0055,
      #8b00ff,
      #0066ff
    );

  box-shadow:
    0 0 18px rgba(120,0,255,.22);
}

.tools{
  display:flex;
  gap:8px;
  margin-top:6px;
}

.tool{
  border:0;
  background:transparent;
  color:#666;
  cursor:pointer;
  font-size:12px;
}

.tool:hover{
  color:#00ffff;
}

.thinking{
  color:#888;
  font-size:14px;
}

/* INPUT */

.input-wrap{
  padding:18px 8% 25px;

  background:
    linear-gradient(
      transparent,
      rgba(5,5,9,.97) 35%
    );
}

.input-area{
  display:flex;
  gap:8px;
  padding:7px;

  border:1px solid transparent;
  border-radius:17px;

  background:
    linear-gradient(#0d0d14,#0d0d14) padding-box,
    linear-gradient(
      90deg,
      #ff0055,
      #ff00ff,
      #0066ff,
      #00ffff,
      #00ff66,
      #ffff00,
      #ff0055
    ) border-box;

  background-size:
    100% 100%,
    300% 100%;

  animation:inputRGB 5s linear infinite;
}

@keyframes inputRGB{
  to{
    background-position:
      0 0,
      300% 0;
  }
}

#input{
  flex:1;
  min-width:0;

  background:transparent;
  border:0;
  outline:0;

  color:white;
  padding:14px;
  font-size:15px;
}

#input::placeholder{
  color:#666;
}

#send{
  width:90px;
  border:0;
  border-radius:12px;

  color:white;
  font-weight:bold;
  cursor:pointer;

  background:
    linear-gradient(
      90deg,
      #ff0055,
      #ff00ff,
      #0066ff,
      #00ffff
    );

  background-size:300%;

  animation:rgbButton 4s linear infinite;
}

@keyframes rgbButton{
  to{
    background-position:300%;
  }
}

#send.stop{
  background:#191922;
  border:1px solid #ff0055;
  animation:none;
}

/* SETTINGS */

.panel{
  position:fixed;
  right:20px;
  top:75px;

  width:280px;

  background:#0d0d14;
  border:1px solid #292936;
  border-radius:14px;

  padding:18px;

  display:none;

  z-index:20;

  box-shadow:
    0 20px 60px #000;
}

.panel.show{
  display:block;
}

.panel h3{
  margin-bottom:15px;
}

.row{
  padding:12px 0;

  border-bottom:1px solid #20202a;

  color:#bbb;

  display:flex;
  justify-content:space-between;
}

.danger{
  margin-top:15px;

  width:100%;

  padding:10px;

  border:1px solid #ff0055;
  border-radius:9px;

  background:transparent;

  color:#ff6688;

  cursor:pointer;
}

.danger:hover{
  background:#ff005522;
}

/* MOBILE */

@media(max-width:700px){

  .sidebar{
    width:210px;
  }

  #chat{
    padding:25px 5%;
  }

  .input-wrap{
    padding:12px 5% 18px;
  }

  .bubble{
    max-width:88%;
  }
}

@media(max-width:520px){

  .sidebar{
    display:none;
  }

  .topbar{
    height:58px;
  }

  #chat{
    padding:20px 15px;
  }

  .input-wrap{
    padding:10px 12px 15px;
  }

  .bubble{
    max-width:92%;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="logo">
⚡ Amzo AI
</div>

<button class="new-chat" onclick="newChat()">
＋ New Chat
</button>

<div class="history-title">
Recent Chats
</div>

<div id="history"></div>

</aside>


<!-- MAIN -->

<main class="main">

<div class="topbar">

<div class="title" id="title">
New Chat
</div>

<button
class="settings-btn"
onclick="toggleSettings()">
⚙
</button>

</div>


<div id="chat">

<div class="message ai">

<div class="bubble">
Hey! 👋 I'm Amzo AI.

Ask me anything!
</div>

</div>

</div>


<div class="input-wrap">

<div class="input-area">

<input
id="input"
type="text"
placeholder="Message Amzo AI..."
autocomplete="off"
>

<button
id="send"
onclick="handleSend()">
Send
</button>

</div>

</div>

</main>

</div>


<!-- SETTINGS -->

<div
class="panel"
id="panel">

<h3>⚙ Settings</h3>

<div class="row">
<span>AI</span>
<span>🟢 Online</span>
</div>

<div class="row">
<span>Theme</span>
<span>RGB Dark</span>
</div>

<div class="row">
<span>Memory</span>
<span>16 messages</span>
</div>

<button
class="danger"
onclick="deleteAll()">
Delete All Chats
</button>

</div>


<script>

const input =
document.getElementById("input");

const chat =
document.getElementById("chat");

const sendBtn =
document.getElementById("send");

const history =
document.getElementById("history");

const title =
document.getElementById("title");

const panel =
document.getElementById("panel");


let chats =
JSON.parse(
localStorage.getItem("amzoChats") || "[]"
);

let currentChat = null;

let controller = null;

let generating = false;


/* SAVE */

function saveChats(){

  localStorage.setItem(
    "amzoChats",
    JSON.stringify(chats)
  );

}


/* HISTORY */

function renderHistory(){

  history.innerHTML = "";

  chats.forEach(c => {

    const item =
      document.createElement("div");

    item.className =
      "chat-item " +
      (c.id === currentChat
        ? "active"
        : "");

    const name =
      document.createElement("div");

    name.className =
      "chat-name";

    name.textContent =
      c.title;

    const actions =
      document.createElement("div");

    actions.className =
      "actions";


    const edit =
      document.createElement("button");

    edit.className =
      "mini";

    edit.textContent =
      "✏️";

    edit.onclick = e => {

      e.stopPropagation();

      renameChat(c.id);

    };


    const del =
      document.createElement("button");

    del.className =
      "mini";

    del.textContent =
      "🗑️";

    del.onclick = e => {

      e.stopPropagation();

      deleteChat(c.id);

    };


    actions.append(
      edit,
      del
    );

    item.append(
      name,
      actions
    );


    item.onclick = () => {

      loadChat(c.id);

    };


    history.appendChild(item);

  });

}


/* NEW CHAT */

function newChat(){

  currentChat = null;

  title.textContent =
    "New Chat";

  chat.innerHTML = `
    <div class="message ai">
      <div class="bubble">
Hey! 👋 I'm Amzo AI.

Ask me anything!
      </div>
    </div>
  `;

  renderHistory();

  input.focus();

}


/* CREATE CHAT */

function createChat(text){

  const id =
    Date.now();

  let chatName =
    text.trim();

  if(chatName.length > 32){

    chatName =
      chatName.substring(0,32) +
      "...";

  }


  const newItem = {

    id:id,

    title:
      chatName || "New Chat",

    messages:[]

  };


  chats.unshift(newItem);

  currentChat =
    id;

  title.textContent =
    newItem.title;

  saveChats();

  renderHistory();

}


/* LOAD */

function loadChat(id){

  const selected =
    chats.find(
      c => c.id === id
    );

  if(!selected)
    return;


  currentChat =
    id;

  title.textContent =
    selected.title;

  chat.innerHTML = "";


  selected.messages.forEach(
    message => {

      addMessage(
        message.text,
        message.type,
        false
      );

    }
  );


  renderHistory();

  chat.scrollTop =
    chat.scrollHeight;

}


/* ADD MESSAGE */

function addMessage(
  text,
  type,
  shouldSave = true
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + type;


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  if(type === "ai"){

    const tools =
      document.createElement("div");

    tools.className =
      "tools";


    const copy =
      document.createElement("button");

    copy.className =
      "tool";

    copy.textContent =
      "📋 Copy";


    copy.onclick = async () => {

      try{

        await navigator.clipboard.writeText(
          text
        );

        copy.textContent =
          "✓ Copied";

        setTimeout(() => {

          copy.textContent =
            "📋 Copy";

        },1200);

      }catch{

        copy.textContent =
          "Copy failed";

      }

    };


    tools.appendChild(copy);

    wrapper.appendChild(
      tools
    );

  }


  chat.appendChild(
    wrapper
  );


  chat.scrollTop =
    chat.scrollHeight;


  if(
    shouldSave &&
    currentChat
  ){

    const selected =
      chats.find(
        c => c.id === currentChat
      );

    if(selected){

      selected.messages.push({
        text:text,
        type:type
      });

      saveChats();

    }

  }

}


/* THINKING */

function showThinking(){

  const thinking =
    document.createElement("div");

  thinking.className =
    "message ai";

  thinking.id =
    "thinking";

  thinking.innerHTML = `
    <div class="thinking">
      🤖 Amzo AI is thinking...
    </div>
  `;

  chat.appendChild(
    thinking
  );

  chat.scrollTop =
    chat.scrollHeight;

}


function removeThinking(){

  const element =
    document.getElementById(
      "thinking"
    );

  if(element)
    element.remove();

}


/* SEND */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text || generating)
    return;


  if(!currentChat){

    createChat(text);

  }


  addMessage(
    text,
    "user"
  );

  input.value = "";

  generating = true;

  controller =
    new AbortController();


  sendBtn.textContent =
    "Stop";

  sendBtn.className =
    "stop";


  showThinking();


  try{

    const selected =
      chats.find(
        c => c.id === currentChat
      );


    const response =
      await fetch(
        "https://ai-tool-api.amzoxamzoo.workers.dev/",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          signal:
            controller.signal,

          body:
            JSON.stringify({

              messages:
                selected.messages

            })

        }
      );


    const data =
      await response.json();


    removeThinking();


    if(data.result){

      await typeResponse(
        data.result
      );

    }else{

      addMessage(
        "Sorry, something went wrong.",
        "ai"
      );

    }


  }catch(error){

    removeThinking();


    if(
      error.name ===
      "AbortError"
    ){

      addMessage(
        "Generation stopped.",
        "ai"
      );

    }else{

      addMessage(
        "Could not connect to the AI server.",
        "ai"
      );

    }

  }


  controller = null;

  generating = false;

  sendBtn.textContent =
    "Send";

  sendBtn.className = "";

  input.focus();

}


/* TYPE RESPONSE */

async function typeResponse(text){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message ai";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  wrapper.appendChild(
    bubble
  );

  chat.appendChild(
    wrapper
  );


  for(
    let i = 0;
    i < text.length;
    i++
  ){

    if(!generating)
      break;

    bubble.textContent +=
      text[i];


    if(i % 3 === 0){

      await new Promise(
        resolve =>
          setTimeout(resolve,5)
      );

    }


    chat.scrollTop =
      chat.scrollHeight;

  }


  const tools =
    document.createElement("div");

  tools.className =
    "tools";


  const copy =
    document.createElement("button");

  copy.className =
    "tool";

  copy.textContent =
    "📋 Copy";


  copy.onclick = async () => {

    await navigator.clipboard.writeText(
      text
    );

    copy.textContent =
      "✓ Copied";

  };


  tools.appendChild(
    copy
  );

  wrapper.appendChild(
    tools
  );


  if(currentChat){

    const selected =
      chats.find(
        c => c.id === currentChat
      );

    if(selected){

      selected.messages.push({
        text:text,
        type:"ai"
      });

      saveChats();

    }

  }

}


/* BUTTON */

function handleSend(){

  if(generating){

    if(controller){

      controller.abort();

    }

    generating = false;

    return;

  }


  sendMessage();

}


/* ENTER */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      handleSend();

    }

  }
);


/* RENAME */

function renameChat(id){

  const selected =
    chats.find(
      c => c.id === id
    );

  if(!selected)
    return;


  const name =
    prompt(
      "New chat name:",
      selected.title
    );


  if(!name ||
     !name.trim())
    return;


  selected.title =
    name.trim().substring(
      0,
      50
    );


  if(currentChat === id){

    title.textContent =
      selected.title;

  }


  saveChats();

  renderHistory();

}


/* DELETE CHAT */

function deleteChat(id){

  if(
    !confirm(
      "Delete this chat?"
    )
  )
    return;


  chats =
    chats.filter(
      c => c.id !== id
    );


  if(currentChat === id){

    currentChat = null;

    newChat();

  }


  saveChats();

  renderHistory();

}


/* DELETE ALL */

function deleteAll(){

  if(
    !confirm(
      "Delete all saved chats?"
    )
  )
    return;


  chats = [];

  currentChat = null;

  saveChats();

  newChat();

  toggleSettings();

}


/* SETTINGS */

function toggleSettings(){

  panel.classList.toggle(
    "show"
  );

}


/* CLOSE SETTINGS */

document.addEventListener(
  "click",
  event => {

    if(
      panel.classList.contains(
        "show"
      ) &&

      !panel.contains(
        event.target
      ) &&

      !event.target.classList.contains(
        "settings-btn"
      )
    ){

      panel.classList.remove(
        "show"
      );

    }

  }
);


/* START */

renderHistory();

input.focus();

</script>

</body>
</html>
