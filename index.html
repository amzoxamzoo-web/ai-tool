<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Idea Generator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #08080d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 700px;
      background: #12121b;
      padding: 35px;
      border: 1px solid #272735;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: #999;
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #30303d;
      background: #0b0b12;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #0b0b12;
      border: 1px solid #272735;
      color: #ddd;
      line-height: 1.7;
      white-space: pre-line;
      min-height: 60px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>AI Idea Generator</h1>

    <p class="subtitle">
      Enter a topic and get AI-generated content ideas.
    </p>

    <input
      id="topic"
      type="text"
      placeholder="Example: Minecraft"
    >

    <button id="generateBtn" onclick="generateIdeas()">
      Generate Ideas
    </button>

    <div id="result">
      Your AI-generated ideas will appear here.
    </div>

  </div>

  <script>
    async function generateIdeas() {

      const topic = document.getElementById("topic").value.trim();
      const result = document.getElementById("result");
      const button = document.getElementById("generateBtn");

      if (!topic) {
        result.innerText = "Please enter a topic.";
        return;
      }

      button.disabled = true;
      button.innerText = "Generating...";
      result.innerText = "AI is thinking...";

      try {
        const response = await fetch(
          "https://ai-tool-api.amzoxamzoo.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              topic: topic
            })
          }
        );

        const data = await response.json();

        if (data.result) {
          result.innerText = data.result;
        } else if (data.error) {
          result.innerText = "Error: " + data.error;
        } else {
          result.innerText = "Something went wrong.";
        }

      } catch (error) {
        result.innerText = "Could not connect to the AI server.";
      }

      button.disabled = false;
      button.innerText = "Generate Ideas";
    }
  </script>

</body>
</html>
