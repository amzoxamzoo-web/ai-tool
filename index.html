<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:#050509;
  overflow:hidden;
}

/* RGB BACKGROUND */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  z-index:-3;
  background:
    radial-gradient(circle at 20% 30%,rgba(255,0,100,.25),transparent 25%),
    radial-gradient(circle at 80% 20%,rgba(0,150,255,.25),transparent 25%),
    radial-gradient(circle at 50% 80%,rgba(120,0,255,.25),transparent 25%);
  filter:blur(70px);
  animation:rgbMove 10s linear infinite alternate;
}

@keyframes rgbMove{
  0%{transform:translate(-5%,-5%) rotate(0deg);}
  50%{transform:translate(5%,3%) rotate(8deg);}
  100%{transform:translate(-2%,6%) rotate(-8deg);}
}

/* RGB BORDER */
.rgb-border{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  border:2px solid transparent;
  animation:borderRGB 5s linear infinite;
}

@keyframes borderRGB{
  0%{box-shadow:inset 0 0 30px #ff0055;}
  33%{box-shadow:inset 0 0 30px #00aaff;}
  66%{box-shadow:inset 0 0 30px #8a00ff;}
  100%{box-shadow:inset 0 0 30px #ff0055;}
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:260px;
  padding:18px;
  background:rgba(10,10,18,.82);
  backdrop-filter:blur(20px);
  border-right:1px solid rgba(255,255,255,.08);
}

.logo{
  font-size:25px;
  font-weight:800;
  margin-bottom:20px;
  animation:logoRGB 4s linear infinite;
}

@keyframes logoRGB{
  0%{text-shadow:0 0 15px #ff0055;}
  33%{text-shadow:0 0 15px #00aaff;}
  66%{text-shadow:0 0 15px #9b00ff;}
  100%{text-shadow:0 0 15px #ff0055;}
}

.new-chat{
  width:100%;
  padding:13px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:12px;
  background:rgba(255,255,255,.06);
  color:#fff;
  cursor:pointer;
  transition:.25s;
}

.new-chat:hover{
  transform:translateY(-2px);
  box-shadow:0 0 20px rgba(0,180,255,.35);
}

.sidebar-title{
  margin:25px 5px 10px;
  color:#aaa;
  font-size:12px;
  text-transform:uppercase;
}

.chat-list{
  max-height:60vh;
  overflow:auto;
}

.chat-item{
  padding:11px;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
  color:#ddd;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-item:hover,
.chat-item.active{
  background:rgba(255,255,255,.09);
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:rgba(5,5,10,.55);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.status{
  color:#65ff9b;
  font-size:13px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:30px max(20px,8%);
}

.welcome{
  text-align:center;
  margin-top:10vh;
}

.welcome h1{
  font-size:46px;
  margin-bottom:10px;
  animation:titleRGB 5s linear infinite;
}

@keyframes titleRGB{
  0%{color:#ff4d88;}
  33%{color:#55ccff;}
  66%{color:#b56cff;}
  100%{color:#ff4d88;}
}

.welcome p{
  color:#999;
}

/* MESSAGES */
.message{
  max-width:850px;
  margin:0 auto 20px;
  padding:15px 18px;
  border-radius:17px;
  line-height:1.55;
  white-space:pre-wrap;
}

.user{
  background:rgba(255,255,255,.08);
}

.ai{
  background:rgba(20,20,30,.7);
  border:1px solid rgba(255,255,255,.07);
}

.message-actions{
  margin-top:10px;
  display:flex;
  gap:7px;
}

.small-btn{
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  color:#bbb;
  padding:5px 9px;
  border-radius:7px;
  cursor:pointer;
}

.small-btn:hover{
  color:#fff;
}

/* IMAGE */
.image-card{
  max-width:850px;
  margin:0 auto 25px;
  padding:15px;
  border-radius:18px;
  background:rgba(10,10,18,.75);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 0 30px rgba(130,0,255,.12);
}

.image-card img{
  display:block;
  width:100%;
  max-height:650px;
  object-fit:contain;
  border-radius:12px;
}

.image-tools{
  display:flex;
  gap:8px;
  margin-top:12px;
}

/* THINKING */
.thinking{
  display:flex;
  gap:5px;
  padding:15px;
  max-width:850px;
  margin:auto;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#aaa;
  animation:dot 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes dot{
  0%,100%{opacity:.2;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-4px)}
}

/* COMPOSER */
.composer-wrap{
  padding:15px max(20px,8%) 20px;
}

.mode-buttons{
  display:flex;
  gap:8px;
  margin-bottom:9px;
}

.mode{
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.05);
  color:#aaa;
  padding:7px 12px;
  border-radius:9px;
  cursor:pointer;
}

.mode.active{
  color:#fff;
  background:rgba(130,70,255,.2);
  box-shadow:0 0 15px rgba(130,70,255,.2);
}

.composer{
  max-width:950px;
  margin:auto;
  display:flex;
  gap:9px;
  padding:9px;
  border-radius:17px;
  background:rgba(15,15,24,.85);
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 0 35px rgba(0,0,0,.4);
}

.composer textarea{
  flex:1;
  resize:none;
  min-height:48px;
  max-height:150px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  padding:13px;
  font-size:15px;
}

.send{
  width:50px;
  border:0;
  border-radius:12px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#7b00ff,#008cff);
  transition:.25s;
}

.send:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px #6200ff;
}

/* IMAGE PANEL */
.image-panel{
  max-width:950px;
  margin:0 auto 12px;
  padding:15px;
  display:none;
  border-radius:15px;
  background:rgba(15,15,24,.9);
  border:1px solid rgba(255,255,255,.1);
}

.image-panel.show{
  display:block;
}

.image-row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.image-input{
  flex:1;
  min-width:200px;
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  outline:0;
  background:#0b0b12;
  color:#fff;
}

.select{
  padding:12px;
  border-radius:10px;
  background:#0b0b12;
  color:#fff;
  border:1px solid rgba(255,255,255,.12);
}

.generate{
  padding:12px 18px;
  border:0;
  border-radius:10px;
  color:#fff;
  cursor:pointer;
  background:linear-gradient(135deg,#ff0077,#7100ff,#008cff);
  background-size:200% 200%;
  animation:gradientMove 4s ease infinite;
}

@keyframes gradientMove{
  0%{background-position:0 50%}
  50%{background-position:100% 50%}
  100%{background-position:0 50%}
}

/* MOBILE */
@media(max-width:750px){
  .sidebar{
    display:none;
  }

  .welcome h1{
    font-size:35px;
  }

  .chat{
    padding:20px 12px;
  }

  .composer-wrap{
    padding:10px;
  }
}
</style>
</head>

<body>

<div class="rgb-border"></div>

<div class="app">

<aside class="sidebar">
  <div class="logo">⚡ Amzo AI</div>

  <button class="new-chat" onclick="newChat()">＋ New Chat</button>

  <div class="sidebar-title">Recent Chats</div>
  <div id="chatList" class="chat-list"></div>
</aside>

<main class="main">

<header class="topbar">
  <strong>Amzo AI</strong>
  <span class="status">● Online</span>
</header>

<section id="chat" class="chat">

  <div id="welcome" class="welcome">
    <h1>What can I help you with?</h1>
    <p>Chat with AI or create an image.</p>
  </div>

</section>

<div class="composer-wrap">

  <div class="mode-buttons">
    <button id="chatMode" class="mode active" onclick="setMode('chat')">
      💬 Chat
    </button>

    <button id="imageMode" class="mode" onclick="setMode('image')">
      🖼️ Image
    </button>
  </div>

  <div id="imagePanel" class="image-panel">

    <div class="image-row">

      <input
        id="imagePrompt"
        class="image-input"
        placeholder="Describe the image you want..."
      >

      <select id="imageSize" class="select">
        <option value="1024x1024">1024 × 1024</option>
        <option value="1280x720">1280 × 720</option>
        <option value="720x1280">720 × 1280</option>
      </select>

      <button class="generate" onclick="generateImage()">
        ✨ Generate
      </button>

    </div>

  </div>

  <div class="composer">

    <textarea
      id="input"
      placeholder="Message Amzo AI..."
      onkeydown="handleKey(event)"
    ></textarea>

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

</div>

</main>
</div>

<script>

const API =
"https://ai-tool-api.amzoxamzoo.workers.dev/";

let mode = "chat";
let chats = JSON.parse(
  localStorage.getItem("amzo_chats") || "[]"
);

let currentChat = null;

/* =========================
   CHAT MANAGEMENT
========================= */

function saveChats(){
  localStorage.setItem(
    "amzo_chats",
    JSON.stringify(chats)
  );
}

function newChat(){

  const chat = {
    id:Date.now(),
    name:"New Chat",
    messages:[]
  };

  chats.unshift(chat);
  currentChat = chat;

  saveChats();
  renderChatList();
  renderChat();
}

function renderChatList(){

  const list =
    document.getElementById("chatList");

  list.innerHTML = "";

  chats.forEach(c => {

    const div =
      document.createElement("div");

    div.className =
      "chat-item " +
      (currentChat?.id === c.id ? "active" : "");

    div.textContent = c.name;

    div.onclick = () => {

      currentChat = c;

      renderChatList();
      renderChat();

    };

    list.appendChild(div);

  });
}

function renderChat(){

  const box =
    document.getElementById("chat");

  box.innerHTML = "";

  if(!currentChat || currentChat.messages.length === 0){

    box.innerHTML = `
      <div id="welcome" class="welcome">
        <h1>What can I help you with?</h1>
        <p>Chat with AI or create an image.</p>
      </div>
    `;

    return;
  }

  currentChat.messages.forEach(m => {

    if(m.type === "image"){

      addImageToUI(
        m.image,
        false
      );

    }else{

      addMessage(
        m.type,
        m.text,
        false
      );

    }

  });
}

/* =========================
   MODE
========================= */

function setMode(newMode){

  mode = newMode;

  document
    .getElementById("chatMode")
    .classList.toggle(
      "active",
      mode === "chat"
    );

  document
    .getElementById("imageMode")
    .classList.toggle(
      "active",
      mode === "image"
    );

  document
    .getElementById("imagePanel")
    .classList.toggle(
      "show",
      mode === "image"
    );

}

/* =========================
   CHAT
========================= */

async function sendMessage(){

  if(mode !== "chat") return;

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if(!text) return;

  if(!currentChat){
    newChat();
  }

  if(currentChat.name === "New Chat"){
    currentChat.name =
      text.slice(0,35);
  }

  currentChat.messages.push({
    type:"user",
    text
  });

  saveChats();
  renderChatList();

  addMessage("user",text);

  input.value = "";

  const thinking =
    document.createElement("div");

  thinking.className = "thinking";

  thinking.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  document
    .getElementById("chat")
    .appendChild(thinking);

  scrollBottom();

  try{

    const response =
      await fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          action:"chat",
          messages:
            currentChat.messages
        })
      });

    const data =
      await response.json();

    thinking.remove();

    if(data.error){
      addMessage(
        "ai",
        "Error: " + data.error
      );
      return;
    }

    const answer =
      data.result || "No response.";

    currentChat.messages.push({
      type:"ai",
      text:answer
    });

    saveChats();

    addMessage("ai",answer);

  }catch(error){

    thinking.remove();

    addMessage(
      "ai",
      "Connection error. Please try again."
    );

  }

}

/* =========================
   MESSAGE UI
========================= */

function addMessage(
  type,
  text,
  scroll=true
){

  const box =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " +
    (type === "user" ? "user" : "ai");

  div.textContent = text;

  if(type === "ai"){

    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";

    const copy =
      document.createElement("button");

    copy.className = "small-btn";
    copy.textContent = "📋 Copy";

    copy.onclick = () =>
      navigator.clipboard.writeText(text);

    const speak =
      document.createElement("button");

    speak.className = "small-btn";
    speak.textContent = "🔊 Speak";

    speak.onclick = () => {

      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(text);

      speechSynthesis.speak(
        utterance
      );

    };

    actions.appendChild(copy);
    actions.appendChild(speak);

    div.appendChild(actions);

  }

  box.appendChild(div);

  if(scroll)
    scrollBottom();
}

/* =========================
   IMAGE GENERATION
========================= */

async function generateImage(){

  const prompt =
    document
      .getElementById("imagePrompt")
      .value
      .trim();

  if(!prompt){

    alert(
      "Please enter an image prompt."
    );

    return;

  }

  if(!currentChat){
    newChat();
  }

  const size =
    document
      .getElementById("imageSize")
      .value
      .split("x");

  const width =
    Number(size[0]);

  const height =
    Number(size[1]);

  const thinking =
    document.createElement("div");

  thinking.className =
    "thinking";

  thinking.innerHTML = `
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  `;

  document
    .getElementById("chat")
    .appendChild(thinking);

  scrollBottom();

  try{

    const response =
      await fetch(API,{
        method:"POST",
        headers:{
          "Content-Type":
            "application/json"
        },
        body:JSON.stringify({
          action:"image",
          prompt,
          width,
          height
        })
      });

    const data =
      await response.json();

    thinking.remove();

    if(data.error){

      addMessage(
        "ai",
        "Image error: " +
        data.error
      );

      return;

    }

    let imageURL;

    if(data.image.startsWith("data:")){

      imageURL = data.image;

    }else{

      imageURL =
        "data:" +
        (data.contentType || "image/png") +
        ";base64," +
        data.image;

    }

    currentChat.messages.push({
      type:"image",
      image:imageURL
    });

    saveChats();

    addImageToUI(
      imageURL,
      true
    );

  }catch(error){

    thinking.remove();

    addMessage(
      "ai",
      "Image generation failed: " +
      error.message
    );

  }

}

/* =========================
   IMAGE UI
========================= */

function addImageToUI(
  imageURL,
  scroll=true
){

  const box =
    document.getElementById("chat");

  const card =
    document.createElement("div");

  card.className =
    "image-card";

  const img =
    document.createElement("img");

  img.src = imageURL;

  const tools =
    document.createElement("div");

  tools.className =
    "image-tools";

  const save =
    document.createElement("button");

  save.className =
    "small-btn";

  save.textContent =
    "⬇️ Save Image";

  save.onclick = () => {

    const a =
      document.createElement("a");

    a.href = imageURL;
    a.download =
      "amzo-ai-image.png";

    a.click();

  };

  const open =
    document.createElement("button");

  open.className =
    "small-btn";

  open.textContent =
    "🔍 Open";

  open.onclick = () =>
    window.open(
      imageURL,
      "_blank"
    );

  tools.appendChild(save);
  tools.appendChild(open);

  card.appendChild(img);
  card.appendChild(tools);

  box.appendChild(card);

  if(scroll)
    scrollBottom();

}

/* =========================
   KEYBOARD
========================= */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}

/* =========================
   SCROLL
========================= */

function scrollBottom(){

  const box =
    document.getElementById("chat");

  box.scrollTop =
    box.scrollHeight;

}

/* =========================
   START
========================= */

if(chats.length){

  currentChat = chats[0];

}else{

  newChat();

}

renderChatList();
renderChat();

</script>

</body>
</html>
