<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amzo AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:white;
  height:100vh;
  overflow:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:
    radial-gradient(circle at 20% 30%,#ff005522,transparent 25%),
    radial-gradient(circle at 80% 20%,#00ffff22,transparent 25%),
    radial-gradient(circle at 50% 80%,#7b00ff22,transparent 25%);
  animation:bgMove 12s infinite alternate;
  z-index:-1;
}

@keyframes bgMove{
  from{transform:translate(0,0) rotate(0deg)}
  to{transform:translate(8%,5%) rotate(8deg)}
}

.app{
  display:flex;
  height:100vh;
}

.sidebar{
  width:270px;
  background:#090909ee;
  border-right:1px solid #222;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.logo{
  font-size:24px;
  font-weight:bold;
  padding:10px;
  text-align:center;
  background:linear-gradient(90deg,#ff00cc,#00ffff,#7b00ff);
  -webkit-background-clip:text;
  color:transparent;
}

.new-chat{
  border:1px solid #333;
  background:#151515;
  color:white;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.new-chat:hover{
  background:#222;
}

.recent-title{
  color:#888;
  font-size:12px;
  margin:8px 5px;
}

.chat-list{
  overflow-y:auto;
  flex:1;
}

.chat-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:5px;
}

.chat-item:hover{
  background:#181818;
}

.chat-item.active{
  background:#222;
}

.chat-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  flex:1;
}

.chat-actions{
  display:flex;
  gap:3px;
}

.chat-actions button{
  border:0;
  background:transparent;
  color:#777;
  cursor:pointer;
}

.chat-actions button:hover{
  color:white;
}

.sidebar-bottom{
  border-top:1px solid #222;
  padding-top:10px;
}

.sidebar-bottom button{
  width:100%;
  padding:10px;
  background:#111;
  color:#aaa;
  border:1px solid #222;
  border-radius:8px;
  cursor:pointer;
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.header{
  height:65px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#080808cc;
}

.header h1{
  font-size:22px;
  background:linear-gradient(90deg,#ff00cc,#00ffff);
  -webkit-background-clip:text;
  color:transparent;
}

.status{
  position:absolute;
  right:18px;
  font-size:12px;
  color:#45ff7a;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px;
}

.welcome{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  flex-direction:column;
  gap:12px;
}

.welcome h2{
  font-size:34px;
}

.welcome p{
  color:#888;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  gap:12px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:#191919;
  border:1px solid #333;
}

.message-content{
  flex:1;
  line-height:1.6;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user .message-content{
  background:#151515;
  padding:10px 14px;
  border-radius:12px;
}

.ai .message-content{
  padding:5px 0;
}

.message-tools{
  margin-top:7px;
  display:flex;
  gap:7px;
}

.message-tools button{
  background:#111;
  border:1px solid #292929;
  color:#999;
  padding:5px 9px;
  border-radius:7px;
  cursor:pointer;
  font-size:12px;
}

.message-tools button:hover{
  color:white;
  border-color:#555;
}

.thinking{
  display:flex;
  gap:5px;
  align-items:center;
  padding:10px 0;
}

.dot{
  width:7px;
  height:7px;
  background:#aaa;
  border-radius:50%;
  animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:.15s}
.dot:nth-child(3){animation-delay:.3s}

@keyframes bounce{
  0%,100%{
    transform:translateY(0);
    opacity:.3
  }
  50%{
    transform:translateY(-5px);
    opacity:1
  }
}

.input-area{
  padding:15px;
  border-top:1px solid #222;
  background:#070707ee;
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:7px;
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:8px;
}

#input{
  flex:1;
  background:transparent;
  color:white;
  border:0;
  outline:none;
  resize:none;
  min-height:42px;
  max-height:140px;
  padding:11px;
  font-size:15px;
}

.input-btn{
  width:42px;
  height:42px;
  border-radius:10px;
  border:1px solid #333;
  background:#191919;
  color:white;
  cursor:pointer;
  font-size:17px;
}

.input-btn:hover{
  background:#252525;
}

.send{
  background:linear-gradient(135deg,#7b00ff,#00bfff);
  border:0;
}

.stop{
  display:none;
  background:#a00000;
}

.hint{
  text-align:center;
  color:#555;
  font-size:11px;
  margin-top:8px;
}

.settings{
  position:fixed;
  inset:0;
  background:#000a;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.settings-card{
  width:360px;
  max-width:90%;
  background:#111;
  border:1px solid #333;
  border-radius:15px;
  padding:20px;
}

.settings-card h2{
  margin-bottom:18px;
}

.setting{
  padding:12px 0;
  border-bottom:1px solid #222;
  color:#bbb;
}

.close-settings{
  width:100%;
  margin-top:18px;
  padding:11px;
  background:#222;
  border:0;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:700px){

  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:20;
    transition:.25s;
  }

  .sidebar.open{
    left:0;
  }

  .header h1{
    font-size:18px;
  }

  .messages{
    padding:15px;
  }

  .message{
    gap:8px;
  }

  .welcome h2{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">AMZO AI</div>

<button class="new-chat" onclick="newChat()">
＋ New Chat
</button>

<div class="recent-title">
RECENT CHATS
</div>

<div class="chat-list" id="chatList"></div>

<div class="sidebar-bottom">
<button onclick="openSettings()">
⚙ Settings
</button>
</div>

</aside>

<main class="main">

<header class="header">

<button
class="input-btn"
style="position:absolute;left:12px"
onclick="toggleSidebar()">
☰
</button>

<h1>Amzo AI</h1>

<div class="status">
● Online
</div>

</header>

<section class="messages" id="messages"></section>

<div class="input-area">

<div class="input-box">

<textarea
id="input"
placeholder="Message Amzo AI..."
rows="1"
onkeydown="handleKey(event)"
></textarea>

<button
class="input-btn"
title="Voice input"
onclick="startVoice()">
🎤
</button>

<button
class="input-btn stop"
id="stopBtn"
onclick="stopGeneration()">
■
</button>

<button
class="input-btn send"
id="sendBtn"
onclick="sendMessage()">
➤
</button>

</div>

<div class="hint">
Enter = Send • Shift + Enter = New line
</div>

</div>

</main>

</div>

<div class="settings" id="settings">

<div class="settings-card">

<h2>⚙ Settings</h2>

<div class="setting">
🟢 AI Status: Online
</div>

<div class="setting">
🧠 Memory: Recent chat enabled
</div>

<div class="setting">
🎤 Voice Input: Browser Speech Recognition
</div>

<div class="setting">
🔊 AI Voice: Browser Speech Synthesis
</div>

<button
class="close-settings"
onclick="closeSettings()">
Close
</button>

</div>

</div>

<script>

const API_URL =
"https://ai-tool-api.amzoxamzoo.workers.dev/";

let chats =
JSON.parse(
localStorage.getItem("amzo_chats") || "[]"
);

let selectedId = null;
let generating = false;
let controller = null;


/* STORAGE */

function saveChats(){

localStorage.setItem(
"amzo_chats",
JSON.stringify(chats)
);

}


/* NEW CHAT */

function newChat(){

const chat = {

id:Date.now(),

name:"New Chat",

messages:[]

};

chats.unshift(chat);

selectedId = chat.id;

saveChats();

renderChatList();

renderMessages();

}


/* SELECT CHAT */

function selectChat(id){

selectedId = id;

renderChatList();

renderMessages();

closeMobileSidebar();

}


/* CURRENT CHAT */

function getSelectedChat(){

return chats.find(
chat => chat.id === selectedId
);

}


/* CHAT LIST */

function renderChatList(){

const list =
document.getElementById("chatList");

list.innerHTML = "";

chats.forEach(chat => {

const item =
document.createElement("div");

item.className =
"chat-item" +
(chat.id === selectedId
? " active"
: "");

const name =
document.createElement("div");

name.className =
"chat-name";

name.textContent =
chat.name || "New Chat";

name.onclick = () =>
selectChat(chat.id);

const actions =
document.createElement("div");

actions.className =
"chat-actions";

const rename =
document.createElement("button");

rename.textContent = "✎";

rename.onclick = event => {

event.stopPropagation();

renameChat(chat.id);

};

const del =
document.createElement("button");

del.textContent = "×";

del.onclick = event => {

event.stopPropagation();

deleteChat(chat.id);

};

actions.appendChild(rename);

actions.appendChild(del);

item.appendChild(name);

item.appendChild(actions);

list.appendChild(item);

});

}


/* RENAME */

function renameChat(id){

const chat =
chats.find(c => c.id === id);

if(!chat) return;

const newName =
prompt(
"Enter chat name:",
chat.name
);

if(newName && newName.trim()){

chat.name =
newName.trim();

saveChats();

renderChatList();

}

}


/* DELETE */

function deleteChat(id){

chats =
chats.filter(
chat => chat.id !== id
);

if(selectedId === id){

selectedId =
chats.length
? chats[0].id
: null;

}

saveChats();

renderChatList();

renderMessages();

}


/* RENDER MESSAGES */

function renderMessages(){

const container =
document.getElementById("messages");

container.innerHTML = "";

const chat =
getSelectedChat();

if(!chat || !chat.messages.length){

container.innerHTML = `

<div class="welcome">

<h2>👋 Hello, I'm Amzo AI</h2>

<p>
Ask me anything.
</p>

</div>

`;

return;

}

chat.messages.forEach(
(message,index) => {

addMessageToUI(
message.type,
message.text,
false,
index
);

}
);

scrollBottom();

}


/* ADD MESSAGE */

function addMessageToUI(
type,
text,
scroll = true
){

const container =
document.getElementById("messages");

const row =
document.createElement("div");

row.className =
"message " +
(type === "user"
? "user"
: "ai");

const avatar =
document.createElement("div");

avatar.className = "avatar";

avatar.textContent =
type === "user"
? "👤"
: "🤖";

const contentWrap =
document.createElement("div");

contentWrap.className =
"message-content";

contentWrap.textContent =
text;

if(type === "assistant"){

const tools =
document.createElement("div");

tools.className =
"message-tools";

const copy =
document.createElement("button");

copy.textContent =
"📋 Copy";

copy.onclick = () =>
copyText(text);

const speak =
document.createElement("button");

speak.textContent =
"🔊 Speak";

speak.onclick = () =>
speakText(text);

tools.appendChild(copy);

tools.appendChild(speak);

contentWrap.appendChild(tools);

}

row.appendChild(avatar);

row.appendChild(contentWrap);

container.appendChild(row);

if(scroll){

scrollBottom();

}

}


/* SEND MESSAGE */

async function sendMessage(){

if(generating) return;

const input =
document.getElementById("input");

const text =
input.value.trim();

if(!text) return;

if(!selectedId){

newChat();

}

const chat =
getSelectedChat();

if(!chat) return;

if(
chat.messages.length === 0 ||
chat.name === "New Chat"
){

chat.name =
text.length > 30
? text.substring(0,30) + "..."
: text;

}

chat.messages.push({

type:"user",

text:text

});

input.value = "";

saveChats();

renderChatList();

renderMessages();

generating = true;

document.getElementById(
"sendBtn"
).style.display = "none";

document.getElementById(
"stopBtn"
).style.display = "block";

const thinking =
document.createElement("div");

thinking.className =
"message ai";

thinking.id = "thinking";

thinking.innerHTML = `

<div class="avatar">🤖</div>

<div class="message-content">

<div class="thinking">

<span class="dot"></span>
<span class="dot"></span>
<span class="dot"></span>

</div>

</div>

`;

document.getElementById(
"messages"
).appendChild(thinking);

scrollBottom();

try{

controller =
new AbortController();

const response =
await fetch(
API_URL,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

messages:
chat.messages

}),

signal:
controller.signal

}
);

const data =
await response.json();

const thinkingElement =
document.getElementById(
"thinking"
);

if(thinkingElement){

thinkingElement.remove();

}

if(!response.ok){

throw new Error(
data.error ||
"AI request failed."
);

}

const answer =
data.result ||
"No response received.";

chat.messages.push({

type:"assistant",

text:answer

});

saveChats();

addMessageToUI(
"assistant",
answer,
true
);

}
catch(error){

const thinkingElement =
document.getElementById(
"thinking"
);

if(thinkingElement){

thinkingElement.remove();

}

if(error.name === "AbortError"){

addMessageToUI(
"assistant",
"Generation stopped."
);

}
else{

addMessageToUI(
"assistant",
"Error: " +
error.message
);

}

}
finally{

generating = false;

controller = null;

document.getElementById(
"sendBtn"
).style.display = "block";

document.getElementById(
"stopBtn"
).style.display = "none";

saveChats();

}

}


/* STOP */

function stopGeneration(){

if(controller){

controller.abort();

}

}


/* KEYBOARD */

function handleKey(event){

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

sendMessage();

}

}


/* =========================
   FIXED VOICE INPUT
========================= */

function startVoice(){

const Recognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!Recognition){

alert(
"Speech recognition is not supported in this browser."
);

return;

}

const recognition =
new Recognition();

recognition.lang = "en-US";

recognition.continuous = false;

recognition.interimResults = false;


recognition.onstart = () => {

console.log(
"🎤 Voice recognition started"
);

};


recognition.onresult =
event => {

const result =
event.results[0][0].transcript;

const input =
document.getElementById("input");

input.value += result;

input.focus();

};


recognition.onerror =
event => {

console.error(
"Voice error:",
event.error
);

let message =
"Voice input failed.";

if(event.error === "not-allowed"){

message =
"Microphone permission was denied. Allow microphone access for this website.";

}

else if(
event.error === "audio-capture"
){

message =
"No microphone was detected.";

}

else if(
event.error === "network"
){

message =
"Speech recognition network error.";

}

else if(
event.error === "service-not-allowed"
){

message =
"Speech recognition service is not allowed.";

}

else if(
event.error === "no-speech"
){

message =
"No speech was detected. Try speaking again.";

}

else if(
event.error === "aborted"
){

message =
"Voice recognition was stopped.";

}

else{

message =
"Voice error: " +
event.error;

}

alert(message);

};


recognition.onend = () => {

console.log(
"🎤 Voice recognition ended"
);

};


try{

recognition.start();

}

catch(error){

console.error(
"Voice start error:",
error
);

alert(
"Could not start voice input: " +
error.message
);

}

}


/* AI VOICE */

function speakText(text){

if(
!("speechSynthesis" in window)
){

alert(
"Voice is not supported in this browser."
);

return;

}

speechSynthesis.cancel();

const speech =
new SpeechSynthesisUtterance(text);

speech.lang =
/[\u0600-\u06FF]/.test(text)
? "ur-PK"
: "en-US";

speech.rate = 1;

speech.pitch = 1;

speechSynthesis.speak(
speech
);

}


/* COPY */

async function copyText(text){

try{

await navigator.clipboard.writeText(
text
);

alert("Copied!");

}
catch{

alert(
"Copy failed."
);

}

}


/* SETTINGS */

function openSettings(){

document.getElementById(
"settings"
).style.display = "flex";

}

function closeSettings(){

document.getElementById(
"settings"
).style.display = "none";

}


/* SIDEBAR */

function toggleSidebar(){

document.getElementById(
"sidebar"
).classList.toggle("open");

}

function closeMobileSidebar(){

document.getElementById(
"sidebar"
).classList.remove("open");

}


/* SCROLL */

function scrollBottom(){

const container =
document.getElementById(
"messages"
);

container.scrollTop =
container.scrollHeight;

}


/* START */

if(chats.length){

selectedId =
chats[0].id;

}
else{

newChat();

}

renderChatList();

renderMessages();

</script>

</body>
</html>
